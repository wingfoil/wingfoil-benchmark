# The v0.1 reference campaign (plan-003 step 5, campaign-cycle): the first preliminary result.
# Shape: rel-v0-1's Goal and 09_experiment-design.md 1.1 (S1 x 3, S2, S3, S8 x 1, in the three arms, on
# Sonnet 5). Pins: calibration's profile (docs/calibration/v0.1.md §1, task-049/050). Slice, cap and budget:
# the revised budget's option A, approved 721321f (the Opus 5 slice reduced to the wingfoil arm).
harnesses:
  wingfoil: { tool: wingfoil, version: v0.2.2 }
scenarios:
  - { id: S1, version: '1.0' }
  - { id: S2, version: '1.0' }
  - { id: S3, version: '1.0' }
  - { id: S8, version: '1.0' }
arms: [baseline, baseline-docs, wingfoil]
agent: { name: claude-code, version: 2.1.280 }
models:
  default: claude-sonnet-5
  slices:
    - { model: claude-opus-5, scenarios: [S1], arms: [wingfoil], repetitions: 1 }
repetitions: { S1: 3, S2: 1, S3: 1, S8: 1 }
approver_policy: v1
caps: { step_time_s: 3600, step_tokens: 20000000, run_cost_eur: 30 }
budget: { warn_eur: 65, ceiling_eur: 85 }
currency: { usd_to_eur: 0.8851 } # ECB euro reference rate of 2026-10-01, as calibration's
