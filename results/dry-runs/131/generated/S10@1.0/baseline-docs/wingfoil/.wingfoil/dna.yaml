# Project DNA (P2.4) — scaffolded by `wingfoil init` (Kanban template).
# Structural map of the project: modules, stacks, team + roles, resource paths. Customize freely.
version: 1.1

project:
  name: Lantern Lane Orders       # your project name
  description: The order book behind Lantern Lane Grocers' home deliveries.
  methodology: Kanban        # Continuous-flow delivery with work-in-progress limits.

# Modules — the parts of the system (anatomy for navigation). Add your own.
modules:
  - name: domain
    description: customers, the catalogue, orders, prices and shipping, under src/domain
  - name: api
    description: the public API the shop's website and staff tools use, src/index.ts

# Stacks — technologies + methodologies in use. The methodologies come from the Kanban template.
stacks:
  technologies:
    - name: TypeScript
      category: language
  methodologies:
    - name: Kanban
    - name: Specification by Example (BDD)
    - name: TDD

# Team & roles — AI agents execute as developer/reviewer/qa/architect and never hold approval authority.
team:
  # Dana Okafor approves and rejects changes; the developer's identity is the agent's (task-118).
  members:
    - name: Dana Okafor
      email: dana.okafor@lanternlane.example
      roles: [approver, product-owner]
    - name: Benchmark Developer
      email: developer@benchmark.localhost
      roles: [developer]
  roles:
    - name: developer
    - name: reviewer
    - name: qa
    - name: architect
    - name: product-owner
    - name: tech-lead
    - name: approver

# Resource paths — query categories used to navigate the project.
paths:
  sources: []
  tests: []
  docs: []
  config: [.wingfoil]
  governance: []
