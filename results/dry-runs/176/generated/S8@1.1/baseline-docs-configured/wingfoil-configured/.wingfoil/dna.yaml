# Project DNA (P2.4) — scaffolded by `wingfoil init` (Kanban template).
# Structural map of the project: modules, stacks, team + roles, resource paths. Customize freely.
version: 1.1

project:
  name: Tidy Tasks                # your project name
  description: The task list behind a small to-do app for households and small teams.
  methodology: Kanban        # Continuous-flow delivery with work-in-progress limits.

# Modules — the parts of the system (anatomy for navigation). Add your own.
modules:
  - name: domain
    description: the task list and its operations, under src/domain (task.ts, list.ts, result.ts, summary.ts); pure, deterministic, errors returned as Result
  - name: api
    description: the public API the app's screens use, src/index.ts; every export the screens need is re-exported there
  - name: tests
    description: node:test suites under test/, run through the public API in src/index.ts (npm test)

# Stacks — technologies + methodologies in use. The methodologies come from the Kanban template.
stacks:
  technologies:
    - name: TypeScript
      category: language
    - name: Node.js
      category: runtime
    - name: node:test
      category: testing
  methodologies:
    - name: Kanban
    - name: Specification by Example (BDD)
    - name: TDD

# Team & roles — AI agents execute as developer/reviewer/qa/architect and never hold approval authority.
team:
  members:
    - name: Benchmark Approver
      email: approver@benchmark.localhost
      roles: [approver]
  roles:
    - name: developer
    - name: reviewer
    - name: qa
    - name: architect
    - name: product-owner
    - name: tech-lead
    - name: approver

# Resource paths — query categories used to navigate the project.
paths:
  sources: [src]
  tests: [test]
  docs: [docs, README.md]
  config: [.wingfoil]
  governance: [docs/memory]
