# Capture a decision-log on demand
name: decision-log-ingest
kind: main
format: 1
description: "Capture a decision-log on demand"
phases:
  - name: capture
    description: "Write the decision-log and submit it for approval."
    role: product-owner
    actions:
      - 'memory.add(type: decision-log)'
      - memory.submit
    produces:
      - docs/memory/decision-log/{id}.md
  - name: approve
    description: "Approve the decision-log (approval gate; a reject sends it back to capture)."
    role: approver
    actions:
      - memory.approve
    approval: { by_role: approver }
    fallback: { step: capture }
