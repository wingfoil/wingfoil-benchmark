# Capture a bug on demand
name: bug-ingest
kind: main
format: 1
description: "Capture a bug on demand"
phases:
  - name: capture
    description: "Write the bug and submit it for approval."
    role: developer
    actions:
      - 'memory.add(type: bug)'
      - memory.submit
    produces:
      - docs/memory/bug/{id}.md
  - name: approve
    description: "Approve the bug (approval gate; a reject sends it back to capture)."
    role: approver
    actions:
      - memory.approve
    approval: { by_role: approver }
