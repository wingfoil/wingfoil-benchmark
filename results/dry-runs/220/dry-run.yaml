# v0.3's dry-run profile with the review loop (task-152, criterion 3; the approver's decision of 2026-11-16 to freeze
# v0.3's measured pins): campaigns/v0-3-reference.dry-run.yaml's pins unchanged (task-144: WingFoil v0.3.1, Claude
# Code 2.1.300 at medium, approver policy v5, the arm digests), plus the review loop scenarios/dry-run.yaml pins
# (task-151), so that W19's loop dry runs measure the loop a v0.3 campaign would pin and price its steps too
# (REQ-CLI-02 as amended in 1.58 and 1.59). Run with --profile; every dry run on it runs and pays for a loop.
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.1 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium, claude-opus-5-5: medium, claude-haiku-5-5: medium }
models: { default: claude-sonnet-5-5 }
approver_policy: v5
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 3 }
currency: { usd_to_eur: 0.8917 } # campaign-008's rate, so that 1.0 and 1.1 costs compare
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 64e37c838830
  wingfoil: a25772055b1d
  speckit: c1a0d9a70b1b
  speckit-docs: b2fbe79ca773
  openspec: f89f9c6098d7
  openspec-docs: 52d8775dd78c
  wingfoil-configured: 78e01e9e6010
  baseline-docs-configured: 15d16d1712c0
  speckit-configured: 47c44dbe96dd
  speckit-docs-configured: c838439a0285
  openspec-configured: 67813a169e1b
  openspec-docs-configured: 19af7d94b669
# The review loop: scenarios/dry-run.yaml's, the approver's choice 2 of 2026-11-13 (task-147).
review_loop:
  agent: { name: claude-code, version: 2.1.300 }
  model: claude-sonnet-5-5
  effort: medium
  prompt: { file: review/prompt.md, sha256: c8bce4bd9083d33c7953fb6f4cba77da07661f4952d900bbe98bf79a86991983 }
  fixer_prompt:
    file: review/fixer-prompt.md
    sha256: 47fcee47291cde67557ee717b7817c3721dadde8410001b0b26bcc446a9ec223
  max_rounds: 5
  caps: { session_time_s: 1800, session_tokens: 10000000, session_cost_eur: 2, fixer_interventions: 5 }
