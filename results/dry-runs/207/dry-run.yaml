# The dry-run profile of v0.3's 1.1 versions (task-144, plan-005 W18 and step 3): every arm, the configured ones
# included, on WingFoil v0.3.1 under Claude Code 2.1.300, effort medium, approver policy v5, run with --profile so
# that scenarios/dry-run.yaml and the campaigns that read it are unchanged. The approver's go (2026-11-09): 52 dry
# runs, 35 EUR ceiling. The arm digests are the main checkout's at `676618cc`, pinned so that every dry run measures
# the same arms.
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.1 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium, claude-opus-5-5: medium, claude-haiku-5-5: medium }
models: { default: claude-sonnet-5-5 }
approver_policy: v5
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 3 }
currency: { usd_to_eur: 0.8917 } # campaign-008's rate, so that 1.0 and 1.1 costs compare
