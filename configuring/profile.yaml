# The configuring agent's profile (REQ-RUN-20, F7.5, task-140): one agent and one model for every harness (T12). Its
# fields are a dry-run profile's, less the approver policy and the arm digests, which a configuring session reads none
# of. The agent is the latest campaigns' (claude-step-a, campaign-008); the harnesses are the arms' pins as W18's
# configured variants run them; the caps and the rate are the dry-run profile's (scenarios/dry-run.yaml).
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium }
models: { default: claude-sonnet-5-5 }
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.1 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 }
currency: { usd_to_eur: 0.8917 } # ECB euro reference rate of 2026-10-20, as scenarios/dry-run.yaml
