# task-094 (plan-004 step 3-bis, outside the v0.2 campaign): S3's baseline on claude-code, one side of the cross-agent
# comparison, read with x-codex-s3-codex.yaml by `bench campaign compare` (experiment design 1.4 §4.5).
# Both files pin the same scenario, arm, repetitions, caps and rate; the agent (name, version, model, effort) is the
# only pin that differs. Consent: task-094's pending → backlog gate (de6922f): caps and the ceiling as that Design
# states them.
harnesses: {}
scenarios:
  - { id: S3, version: '1.0' }
arms: [baseline]
agent:
  name: claude-code
  version: 2.1.300
  effort:
    claude-sonnet-5-5: medium
models:
  default: claude-sonnet-5-5
repetitions: { S3: 2 }
approver_policy: v1
caps: { step_time_s: 3600, step_tokens: 20000000, run_cost_eur: 3 }
budget: { warn_eur: 4, ceiling_eur: 6 }
currency: { usd_to_eur: 0.8851 }
