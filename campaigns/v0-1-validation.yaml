# The v0.1 validation (task-052, plan-003 step 4): one end-to-end run with the real agent on the cheapest
# scenario. Pins: calibration's profile (scenarios/dry-run.yaml, task-050). Cap and ceiling: the spending
# task-052's pending -> backlog approval consented (92b1bf8), not option A's (the reference campaign's).
harnesses: {}
scenarios:
  - id: S3
    version: '1.0'
arms: [baseline]
agent: { name: claude-code, version: 2.1.280 }
models: { default: claude-sonnet-5 }
repetitions: { S3: 1 }
approver_policy: v1
caps: { step_time_s: 3600, step_tokens: 20000000, run_cost_eur: 3 }
budget: { warn_eur: 2, ceiling_eur: 3 }
currency: { usd_to_eur: 0.8851 } # ECB euro reference rate of 2026-10-01, as calibration's
