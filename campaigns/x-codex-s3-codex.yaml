# task-094 (plan-004 step 3-bis, outside the v0.2 campaign): S3's baseline on codex, one side of the cross-agent
# comparison, read with x-codex-s3-claude-code.yaml by `bench campaign compare` (experiment design 1.4 §4.5).
# Both files pin the same scenario, arm, repetitions, caps and rate; the agent (name, version, model, effort) is the
# only pin that differs. Consent: task-094's pending → backlog gate (de6922f): caps and the ceiling as that Design
# states them.
# Codex runs on the ChatGPT Plus subscription under dl-019; its cost is API-equivalent from a pinned
# price table (costBasis price-table). Its version is the latest at design (2026-10-09), re-read before the runs.
harnesses: {}
scenarios:
  - { id: S3, version: '1.0' }
arms: [baseline]
agent:
  name: codex
  version: 0.162.1
  effort:
    gpt-6.1-sol: medium
models:
  default: gpt-6.1-sol
repetitions: { S3: 2 }
approver_policy: v1
caps: { step_time_s: 3600, step_tokens: 20000000, run_cost_eur: 3 }
budget: { warn_eur: 4, ceiling_eur: 6 }
currency: { usd_to_eur: 0.8851 }
