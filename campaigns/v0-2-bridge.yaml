# The v0.2 bridge (dl-007, dl-017; experiment design 1.3 §6): v0.1's configuration, S1, S2, S3 and S8 in baseline,
# baseline-docs and wingfoil, on WingFoil v0.2.2 with task-086's manual, re-run on the reference campaign's model,
# Claude Code version, effort and scenario versions. A campaign of its own (REQ-FMT-01): every pin but the arms is
# v0-2-reference.yaml's, and both run from the same benchmark commit, recorded in both campaign elements. It links
# c82a5e74885b/2 (v0.1) to the reference campaign; it is run only if the reference campaign pins WingFoil v0.3.
# Calibration (plan-004 step 3, task-096, docs/calibration/v0.2.md) set the same values as v0-2-reference.yaml's, and
# the bridge's own budget, from its dry runs on v0.2.2 (`v0-2-bridge.dry-run.yaml`).
# `arm_digests` are the committed arms' (REQ-FMT-13), the same as the reference campaign's for these three arms.
harnesses:
  wingfoil: { tool: wingfoil, version: v0.2.2 } # held at v0.2.2 by dl-017
scenarios:
  - { id: S1, version: '1.0' }
  - { id: S2, version: '1.0' }
  - { id: S3, version: '1.0' }
  - { id: S8, version: '1.0' }
arms: [baseline, baseline-docs, wingfoil]
agent:
  name: claude-code
  version: 2.1.300 # task-093's pin (dl-018), calibration's (task-096)
  effort: # dl-015, dl-018: medium for the three, as calibration measured them (task-096)
    claude-sonnet-5-5: medium
    claude-opus-5-5: medium
    claude-haiku-5-5: medium
models:
  default: claude-sonnet-5-5
repetitions: { S1: 3, S2: 1, S3: 1, S8: 1 }
approver_policy: v1
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 } # task-096: the dearest dry run 2.44 EUR (Opus 5.5)
budget: { warn_eur: 12, ceiling_eur: 15 } # task-096: about 1.5 times the estimate's high; 65 EUR with the reference
fail_fast: { same_error: 3 } # task-096 (REQ-RUN-19)
currency: { usd_to_eur: 0.8917 } # ECB euro reference rate of 2026-10-20, calibration's: 1 EUR = 1.1215 USD
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 2ac51091da99
  wingfoil: 680b19f27c9f # v0.2.2's arm (task-086), read from history once the tree moved on to v0.3.0's (task-095)
