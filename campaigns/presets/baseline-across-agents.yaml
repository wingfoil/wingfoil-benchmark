# A preset (dl-022): the baseline arm alone, to compare agents (M-R across agents, experiment design 1.4 §4.5). The
# extending file names the agent, its effort per model and its models; results are published as their own
# comparison, never mixed with the Claude headline (T14).
description: the baseline arm only, every registered scenario, one agent and its models
harnesses: {}
scenarios:
  - { id: S1, version: '1.0' }
  - { id: S2, version: '1.0' }
  - { id: S3, version: '1.0' }
  - { id: S8, version: '1.0' }
arms: [baseline]
repetitions: { S1: 3, S2: 1, S3: 1, S8: 1 }
approver_policy: v1
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 }
budget: { warn_eur: 40, ceiling_eur: 50 }
fail_fast: { same_error: 3 }
currency: { usd_to_eur: 0.8917 }
arm_digests: { baseline: 964b1354526c }
