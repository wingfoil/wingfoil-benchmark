# A preset (dl-022, REQ-FMT-01 as amended in 1.34): a partial campaign file that a campaign file extends with
# `extends: presets/reference.yaml`, writing only what differs. Its pins are the v0.3 reference campaign's, set by
# v0.3's calibration (task-154, plan-005 step 3, docs/calibration/v0.3.md) from the approver's choices of 2026-11-17:
# every arm, the six configured ones included (F7.5); S1 x 3 and S2, S3, S8 x 1, as campaign-002 (dl-023's repetition
# campaigns stay possible); the review loop (F4.9); one model slice, Haiku 5.5 on S1 and S3 in baseline and wingfoil
# (dl-031). Until task-154 the preset held v0.2's pins (campaign-002, 81ebb2691f9c); no campaign file extended it, so
# no stored campaign's id changed. The pins are v0.3's measured ones, frozen by the approver on 2026-11-16 (task-152):
# WingFoil v0.3.1, Claude Code 2.1.300 at medium, approver policy v5. The arm digests are those every 1.1 dry run
# measured (campaigns/v0-3-reference.dry-run.yaml); a changed arm changes its digest here. A file cannot remove a
# harness, a digest or a repetition this preset sets: to narrow the arms, extend harness-vs-docs; to narrow the
# scenarios, extend repetitions.
description: every arm, every registered scenario, the release's default model and its model slices
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.1 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
scenarios:
  - { id: S1, version: '1.1' }
  - { id: S2, version: '1.1' }
  - { id: S3, version: '1.1' }
  - { id: S8, version: '1.1' }
arms:
  - baseline
  - baseline-docs
  - wingfoil
  - speckit
  - speckit-docs
  - openspec
  - openspec-docs
  - wingfoil-configured
  - baseline-docs-configured
  - speckit-configured
  - speckit-docs-configured
  - openspec-configured
  - openspec-docs-configured
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium, claude-haiku-5-5: medium }
models:
  default: claude-sonnet-5-5
  slices:
    - { model: claude-haiku-5-5, scenarios: [S1, S3], arms: [baseline, wingfoil], repetitions: 1 }
repetitions: { S1: 3, S2: 1, S3: 1, S8: 1 } # dl-017 point 4, as dl-023 keeps it
approver_policy: v5
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 3 }
# v0.2's budget, until v0.3's calibration sets the reference campaign's at the approver's budget gate (task-154).
budget: { warn_eur: 40, ceiling_eur: 50 }
fail_fast: { same_error: 3 }
currency: { usd_to_eur: 0.8917 } # campaign-008's and the 1.1 dry runs' rate, so that 1.0 and 1.1 costs compare
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 64e37c838830
  wingfoil: a25772055b1d
  speckit: c1a0d9a70b1b
  speckit-docs: b2fbe79ca773
  openspec: f89f9c6098d7
  openspec-docs: 52d8775dd78c
  wingfoil-configured: 78e01e9e6010
  baseline-docs-configured: 15d16d1712c0
  speckit-configured: 47c44dbe96dd
  speckit-docs-configured: c838439a0285
  openspec-configured: 67813a169e1b
  openspec-docs-configured: 19af7d94b669
review_loop: # task-151's, as campaigns/v0-3-review-loop.dry-run.yaml pins it and dry runs 208-215 ran it
  agent: { name: claude-code, version: 2.1.300 }
  model: claude-sonnet-5-5
  effort: medium
  prompt: { file: review/prompt.md, sha256: c8bce4bd9083d33c7953fb6f4cba77da07661f4952d900bbe98bf79a86991983 }
  fixer_prompt:
    file: review/fixer-prompt.md
    sha256: 47fcee47291cde67557ee717b7817c3721dadde8410001b0b26bcc446a9ec223
  max_rounds: 5
  caps: { session_time_s: 1800, session_tokens: 10000000, session_cost_eur: 2, fixer_interventions: 5 }
