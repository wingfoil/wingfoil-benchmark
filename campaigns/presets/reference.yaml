# A preset (dl-022, REQ-FMT-01 as amended in 1.34): a partial campaign file that a campaign file extends with
# `extends: presets/reference.yaml`, writing only what differs. Its pins are the v0.2 reference campaign's
# (campaigns/v0-2-reference.yaml, task-096's calibration); v0.3's calibration revises them. Until then a file that
# extends it and changes nothing resolves to campaign-002's pins, and so to its id (81ebb2691f9c): running it would
# be campaign-002's next execution. A file cannot remove a harness, a digest or a repetition this preset sets: to
# narrow the arms or the scenarios, extend harness-vs-docs, baseline-across-agents or repetitions instead.
description: every arm, every registered scenario, the release's default model and its model slices
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.0 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
scenarios:
  - { id: S1, version: '1.0' }
  - { id: S2, version: '1.0' }
  - { id: S3, version: '1.0' }
  - { id: S8, version: '1.0' }
arms: [baseline, baseline-docs, wingfoil, speckit, speckit-docs, openspec, openspec-docs]
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium, claude-opus-5-5: medium, claude-haiku-5-5: medium }
models:
  default: claude-sonnet-5-5
  slices:
    - { model: claude-opus-5-5, scenarios: [S1], arms: [baseline, baseline-docs, wingfoil], repetitions: 1 }
    - { model: claude-haiku-5-5, scenarios: [S1, S3], arms: [baseline, wingfoil], repetitions: 1 }
repetitions: { S1: 3, S2: 1, S3: 1, S8: 1 } # dl-017 point 4, as dl-023 keeps it
approver_policy: v1
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 }
budget: { warn_eur: 40, ceiling_eur: 50 }
fail_fast: { same_error: 3 }
currency: { usd_to_eur: 0.8917 }
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 2ac51091da99
  wingfoil: 45a5cce3de19
  speckit: 3f2ec815ac70
  speckit-docs: b2fbe79ca773
  openspec: 1ba12def23cf
  openspec-docs: 52d8775dd78c
