# A preset (dl-022): one harness against its docs control and the baseline. The extending file names the arms, the
# harness and the arms' digests, which a preset holding every harness could not leave out (lists are replaced
# whole, maps merged by key).
description: one harness arm with its docs control and the baseline, on the default model
scenarios:
  - { id: S1, version: '1.0' }
  - { id: S2, version: '1.0' }
  - { id: S3, version: '1.0' }
  - { id: S8, version: '1.0' }
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium }
models: { default: claude-sonnet-5-5 }
repetitions: { S1: 3, S2: 1, S3: 1, S8: 1 }
approver_policy: v1
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 }
budget: { warn_eur: 40, ceiling_eur: 50 }
fail_fast: { same_error: 3 }
currency: { usd_to_eur: 0.8917 }
