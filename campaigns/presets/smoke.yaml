# A preset (dl-022): the cheapest check that every arm still runs, S3 once in every arm on the default model. A file
# cannot remove a harness or a digest this preset sets: a smoke run in fewer arms is a whole file, or extends
# repetitions (which sets no scenario, arm or repetition) with S3 once.
description: one cheap scenario (S3) in every arm, one repetition, on the default model
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.0 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
scenarios:
  - { id: S3, version: '1.0' }
arms: [baseline, baseline-docs, wingfoil, speckit, speckit-docs, openspec, openspec-docs]
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium }
models: { default: claude-sonnet-5-5 }
repetitions: { S3: 1 }
approver_policy: v1
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 }
budget: { warn_eur: 5, ceiling_eur: 10 }
fail_fast: { same_error: 3 }
currency: { usd_to_eur: 0.8917 }
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 2ac51091da99
  wingfoil: 45a5cce3de19
  speckit: 3f2ec815ac70
  speckit-docs: b2fbe79ca773
  openspec: 1ba12def23cf
  openspec-docs: 52d8775dd78c
