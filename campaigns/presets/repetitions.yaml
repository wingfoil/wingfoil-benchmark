# A preset (dl-023): a repetition campaign. The extending file names the groups to raise: their scenarios, arms,
# harnesses, arm digests and `repetitions` (3 per group, less the runs the reference campaign already has of the
# same key). Joining its runs to the reference campaign's groups of the same key is dl-023's rule, which a later
# task implements (REQ-RES-03); until then a repetition campaign reads on its own.
description: more repetitions of chosen groups, on the default model, to take them out of preliminary
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium }
models: { default: claude-sonnet-5-5 }
approver_policy: v1
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 }
budget: { warn_eur: 40, ceiling_eur: 50 }
fail_fast: { same_error: 3 }
currency: { usd_to_eur: 0.8917 }
