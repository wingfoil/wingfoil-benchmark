# The v0.2 reference campaign (campaign-002, plan-004 step 5, campaign-cycle). Shape: experiment design 1.3 §6, from
# dl-007 (B + E: Sonnet 5.5 by default, the Opus 5.5 slice in three arms, the Haiku 4.5 rung on S1 and S3), dl-012
# and dl-017 (v0.1's repetitions, S1 x 3 and S2, S3, S8 x 1, until WingFoil 1.0 or the benchmark's 1.0). Seven arms:
# the baseline, and each harness with its own docs control (rel-v0-2's triage, T3).
# Its bridge is v0-2-bridge.yaml, a campaign of its own (REQ-FMT-01): every pin but the arms is the same, and both run
# from the same benchmark commit, recorded in both campaign elements (dl-017).
# Calibration (plan-004 step 3) sets the values marked "placeholder": the agent's version (task-062: 2.1.291 or
# later), the effort per model (dl-015), the caps, the budget (covering the bridge too, REQ-FMT-01), the rate (the ECB
# reference rate of calibration's day), and whether the campaign stops on repeated errors (`fail_fast`, REQ-RUN-19).
# `arm_digests` are the committed arms' (REQ-FMT-13); a changed arm changes its digest here.
harnesses:
  # v0.2.2 until WingFoil v0.3 is released and admitted (dl-017, by 2026-10-31): the task that admits it moves this
  # pin, the wingfoil arm's manual and their digests.
  wingfoil: { tool: wingfoil, version: v0.2.2 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
scenarios:
  - { id: S1, version: '1.0' }
  - { id: S2, version: '1.0' }
  - { id: S3, version: '1.0' }
  - { id: S8, version: '1.0' }
arms: [baseline, baseline-docs, wingfoil, speckit, speckit-docs, openspec, openspec-docs]
agent:
  name: claude-code
  version: 2.1.291 # placeholder: calibration sets it
  effort: # placeholder: calibration sets it (dl-015)
    claude-sonnet-5-5: high
    claude-opus-5-5: high
    claude-haiku-4-5: none
models:
  default: claude-sonnet-5-5
  slices:
    - { model: claude-opus-5-5, scenarios: [S1], arms: [baseline, baseline-docs, wingfoil], repetitions: 1 }
    - { model: claude-haiku-4-5, scenarios: [S1, S3], arms: [baseline, wingfoil], repetitions: 1 }
repetitions: { S1: 3, S2: 1, S3: 1, S8: 1 }
approver_policy: v1
caps: { step_time_s: 3600, step_tokens: 20000000, run_cost_eur: 30 } # placeholder: calibration sets it (v0.1's)
budget: { warn_eur: 85, ceiling_eur: 100 } # placeholder: calibration sets it (the first sizing, rel-v0-2)
currency: { usd_to_eur: 0.8851 } # placeholder: calibration sets it (v0.1's rate of 2026-10-01)
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 2ac51091da99
  wingfoil: 680b19f27c9f
  speckit: 3f2ec815ac70
  speckit-docs: b2fbe79ca773
  openspec: 79f81183dbbe
  openspec-docs: 52d8775dd78c
