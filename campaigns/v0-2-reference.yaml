# The v0.2 reference campaign (campaign-002, plan-004 step 5, campaign-cycle). Shape: experiment design 1.3 §6, from
# dl-007 (B + E: Sonnet 5.5 by default, the Opus 5.5 slice in three arms, the Haiku rung on S1 and S3, on Haiku 5.5 by dl-018), dl-012
# and dl-017 (v0.1's repetitions, S1 x 3 and S2, S3, S8 x 1, until WingFoil 1.0 or the benchmark's 1.0). Seven arms:
# the baseline, and each harness with its own docs control (rel-v0-2's triage, T3).
# Its bridge is v0-2-bridge.yaml, a campaign of its own (REQ-FMT-01), run only if this campaign pins WingFoil v0.3:
# every pin but the arms is the same, and both run from the same benchmark commit, recorded in both campaign elements
# (dl-017).
# Calibration (plan-004 step 3, task-096, docs/calibration/v0.2.md) set the agent's version, the effort per model
# (dl-015, dl-018), the caps, the budget (with the bridge's, 65 EUR in all, REQ-FMT-01), the rate (the ECB reference
# rate of its first day) and `fail_fast` (REQ-RUN-19), as the approver approved them.
# `arm_digests` are the committed arms' (REQ-FMT-13); a changed arm changes its digest here.
harnesses:
  # WingFoil v0.3.0 (cc31d7a8, released 2026-10-19), admitted by task-095 (dl-017); the wingfoil arm's manual and
  # digest follow it. The bridge keeps v0.2.2's arm, read from history by its pinned digest (REQ-FMT-13, 1.33).
  wingfoil: { tool: wingfoil, version: v0.3.0 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
scenarios:
  - { id: S1, version: '1.0' }
  - { id: S2, version: '1.0' }
  - { id: S3, version: '1.0' }
  - { id: S8, version: '1.0' }
arms: [baseline, baseline-docs, wingfoil, speckit, speckit-docs, openspec, openspec-docs]
agent:
  name: claude-code
  version: 2.1.300 # task-093's pin (dl-018), calibration's (task-096)
  effort: # dl-015, dl-018: medium for the three, as calibration measured them (task-096)
    claude-sonnet-5-5: medium
    claude-opus-5-5: medium
    claude-haiku-5-5: medium
models:
  default: claude-sonnet-5-5
  slices:
    - { model: claude-opus-5-5, scenarios: [S1], arms: [baseline, baseline-docs, wingfoil], repetitions: 1 }
    - { model: claude-haiku-5-5, scenarios: [S1, S3], arms: [baseline, wingfoil], repetitions: 1 } # dl-018
repetitions: { S1: 3, S2: 1, S3: 1, S8: 1 }
approver_policy: v1
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 } # task-096: the dearest dry run 2.44 EUR (Opus 5.5)
budget: { warn_eur: 40, ceiling_eur: 50 } # task-096: about 1.5 times the estimate's high; 65 EUR with the bridge
fail_fast: { same_error: 3 } # task-096 (REQ-RUN-19)
currency: { usd_to_eur: 0.8917 } # ECB euro reference rate of 2026-10-20, calibration's: 1 EUR = 1.1215 USD
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 2ac51091da99
  wingfoil: 45a5cce3de19
  speckit: 3f2ec815ac70
  speckit-docs: b2fbe79ca773
  openspec: 1ba12def23cf # bug-023: the manual carries a request past propose (task-096)
  openspec-docs: 52d8775dd78c
