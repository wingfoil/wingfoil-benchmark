# The v0.2 validation (task-097, plan-004 step 4, release-cycle 4 validation, dl-010 B): one run per arm of the
# reference campaign on S1@1.0, the scenario with calibration's largest step transcript. Every pin is
# v0-2-reference.yaml's, but no slice, one repetition and its own budget, which task-097's pending -> backlog
# approval consented.
harnesses:
  # WingFoil v0.3.0 (cc31d7a8, released 2026-10-19), admitted by task-095 (dl-017); the wingfoil arm's manual and
  # digest follow it. The bridge keeps v0.2.2's arm, read from history by its pinned digest (REQ-FMT-13, 1.33).
  wingfoil: { tool: wingfoil, version: v0.3.0 }
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
scenarios:
  - { id: S1, version: '1.0' }
arms: [baseline, baseline-docs, wingfoil, speckit, speckit-docs, openspec, openspec-docs]
agent:
  name: claude-code
  version: 2.1.300 # task-093's pin (dl-018), calibration's (task-096)
  effort: # dl-015, dl-018: medium for the three, as calibration measured them (task-096)
    claude-sonnet-5-5: medium
    claude-opus-5-5: medium
    claude-haiku-5-5: medium
models: { default: claude-sonnet-5-5 }
repetitions: { S1: 1 }
approver_policy: v1
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 } # task-096: the dearest dry run 2.44 EUR (Opus 5.5)
budget: { warn_eur: 6, ceiling_eur: 7 } # task-097's consent
fail_fast: { same_error: 3 } # task-096 (REQ-RUN-19)
currency: { usd_to_eur: 0.8917 } # ECB euro reference rate of 2026-10-20, calibration's: 1 EUR = 1.1215 USD
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 2ac51091da99
  wingfoil: 45a5cce3de19
  speckit: 3f2ec815ac70
  speckit-docs: b2fbe79ca773
  openspec: 1ba12def23cf # bug-023: the manual carries a request past propose (task-096)
  openspec-docs: 52d8775dd78c
