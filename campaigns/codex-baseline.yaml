# The Codex baseline campaign (dl-022, arm A; task-102): the baseline arm on S1, S2, S3 and S8 at 1.0, on Codex CLI
# 0.162.1 (task-094's pin, dl-022), so that its results compare with Claude Code's baseline in campaign-002 (M-R
# across agents, experiment design 1.4 §4.5). Published only as its own cross-agent comparison, never mixed with the
# Claude headline (T14).
# Models, the approver's option A in task-102 (Codex 0.162.1 offers no Terra of generation 6): the latest of each
# name, gpt-6.1-sol by default, gpt-5.6-terra and gpt-6-luna as slices over the same scenarios; one effort, medium,
# as the Claude models run (dl-015, dl-018). The scale mixes generations: the method page says so.
# Codex runs on the ChatGPT Plus subscription under dl-024, until 2026-11-13; its cost is API-equivalent from the
# pinned price table (costBasis price-table), not spent. If not every run fits by 2026-11-12 (dl-022): S3's dry runs
# on every model, then Sol's whole campaign, then Luna, then Terra.
extends: presets/baseline-across-agents.yaml
agent:
  name: codex
  version: 0.162.1
  effort:
    gpt-6.1-sol: medium
    gpt-5.6-terra: medium
    gpt-6-luna: medium
models:
  default: gpt-6.1-sol
  slices:
    - { model: gpt-5.6-terra, scenarios: [S1, S2, S3, S8], arms: [baseline], repetitions: 1 }
    - { model: gpt-6-luna, scenarios: [S1, S2, S3, S8], arms: [baseline], repetitions: 1 }
