# campaign-008 (plan-005 W17, dl-031; dl-029 point 8): the step-A arms (dl-021, task-114) on WingFoil v0.3.1 under
# Claude Code 2.1.300, every published scenario (S1, S2, S3, S8 and S10) x 3, on Sonnet 5.5 (the default) and on the
# weak Haiku 5.5 (the slice), both at effort medium: 90 runs, preliminary. Approver policy v5 for every scenario
# (S10 refuses v1 and v2; for the scenarios without verdicts v5 behaves as v2), so the comparison is arm against arm
# and model against model within this campaign, not across agents with campaign-007 (approver policy v2). The
# wingfoil arm at cc009b5a52a9 (bug-039's manual, rewrapped after S10's calibration, task-119). Scenario versions
# 1.0: W16's 1.1 does not exist yet (the approver, 2026-10-31).
extends: presets/harness-vs-docs.yaml
scenarios:
  - { id: S1, version: '1.0' }
  - { id: S2, version: '1.0' }
  - { id: S3, version: '1.0' }
  - { id: S8, version: '1.0' }
  - { id: S10, version: '1.0' }
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.1 }
arms: [baseline, baseline-docs, wingfoil]
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 64e37c838830
  wingfoil: cc009b5a52a9
agent:
  name: claude-code
  version: 2.1.300
  effort: { claude-sonnet-5-5: medium, claude-haiku-5-5: medium }
models:
  default: claude-sonnet-5-5
  slices:
    - {
        model: claude-haiku-5-5,
        scenarios: [S1, S2, S3, S8, S10],
        arms: [baseline, baseline-docs, wingfoil],
        repetitions: 3,
      }
repetitions: { S1: 3, S2: 3, S3: 3, S8: 3, S10: 3 }
approver_policy: v5
budget: { warn_eur: 25, ceiling_eur: 30 }
