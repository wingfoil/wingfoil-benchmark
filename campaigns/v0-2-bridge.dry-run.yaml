# task-096's dry-run profile for the bridge (campaigns/v0-2-bridge.yaml; REQ-CLI-05, `--profile`): the reference's
# pins (scenarios/dry-run.yaml) but WingFoil v0.2.2, its wingfoil arm read from history by its pinned digest
# (REQ-FMT-13), so that the bridge's estimate reads these dry runs only.
harnesses:
  wingfoil: { tool: wingfoil, version: v0.2.2 } # the runner resolves it to 12537b62
agent:
  name: claude-code
  version: 2.1.300
  effort:
    claude-sonnet-5-5: medium
    claude-opus-5-5: medium
    claude-haiku-5-5: medium
models: { default: claude-sonnet-5-5 }
approver_policy: v1
# The caps: the campaigns' after calibration (task-096); each stage's own are in the dry runs' stored profiles.
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 }
currency: { usd_to_eur: 0.8917 } # ECB euro reference rate of 2026-10-20: 1 EUR = 1.1215 USD
arm_digests: { wingfoil: 680b19f27c9f }
