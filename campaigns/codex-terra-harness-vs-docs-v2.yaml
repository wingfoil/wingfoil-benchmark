# dl-022's arm B rerun on approver policy v2 (task-106, bug-035): campaign-005's file (`codex-terra-harness-vs-docs.yaml`,
# `c4c49685911c`) with the one pin that changed. Under v1 the neutral approver missed six of Codex's seven approval
# requests in the wingfoil arm, so that execution measured v0.2's manual with v1 on an unattended Codex, not WingFoil on
# Codex. v2 reads them (REQ-RUN-06 as amended in 1.38). Everything else as campaign-005: the wingfoil arm on Codex
# against its docs control and the baseline, on gpt-5.6-terra at medium, S1 x 3 and S2, S3, S8 x 1 (18 runs), on Codex
# CLI 0.162.1 and the ChatGPT Plus subscription until 2026-11-13 (dl-025). The preset keeps v1: changing it would
# change every campaign that extends it. Its estimate reads campaign-005's dry runs (the approver policy is not part of
# a dry run's key), and is a lower bound for the wingfoil arm: in its four dry runs (79, 81, 83, 85) 9 of 17 steps
# stopped at a request v1 missed and ended without their work, which v2 answers. Not comparable across agents with a
# v1 execution: M-R across needs the same approver policy.
