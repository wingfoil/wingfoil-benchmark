# campaign-007 (dl-027, dl-031; task-114, task-115): the wingfoil arm at step A (dl-021) on WingFoil v0.3.1, against
# its docs control (every role's directives, REQ-RUN-11 as amended in 1.41) and the baseline, on Codex CLI 0.162.1 and
# approver policy v2 (dl-026). The default model, gpt-5.6-terra at medium, runs the preset's repetitions (S1 x 3; S2,
# S3, S8 x 1: 18 runs), the bridge with campaign-006 (whose wingfoil arm carries bug-036's erratum: the comparison gets
# a note). gpt-6-luna's slice (dl-031), the weak model, runs every scenario x 3 on the three arms (36 runs). Codex runs
# on the ChatGPT Plus subscription under dl-024, until 2026-11-13; its cost is API-equivalent (price-table), not spent.
# Cut order if not every run fits (dl-031 item 5): Luna's S2, S3, S8 repetitions 2 and 3 first, then the default
# model's S3, S1 x 3, S2, S8; Luna's first repetitions last.
extends: presets/harness-vs-docs.yaml
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.1 }
arms: [baseline, baseline-docs, wingfoil]
arm_digests:
  baseline: 964b1354526c
  baseline-docs: 64e37c838830
  wingfoil: cf70ad7ed9aa
agent:
  name: codex
  version: 0.162.1
  effort: { gpt-5.6-terra: medium, gpt-6-luna: medium }
models:
  default: gpt-5.6-terra
  slices:
    - {
        model: gpt-6-luna,
        scenarios: [S1, S2, S3, S8],
        arms: [baseline, baseline-docs, wingfoil],
        repetitions: 3,
      }
approver_policy: v2
