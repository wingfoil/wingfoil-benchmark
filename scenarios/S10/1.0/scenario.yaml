# S10 — Gates and roles (docs/02_specification/scenarios/S10.md 1.0; task-116, dl-029). Its process lives only in
# arms/wingfoil/ (K3, dl-005). The verdicts (task-117), the approver's identity and the gate and attribution checks
# (task-118) are added by the method's tasks before its calibration. Immutable from its first stored result.
id: S10
version: '1.0'
categories: { primary: E, secondary: [C] }
profiles: [tech-lead, code-reviewer, architect]
gqm: [Q-E2, Q-E3, Q-C1]
capabilities: [directive-delivery, memory-lifecycle]
seed: seed
steps:
  - { n: 1, prompt_file: prompts/01.md }
  - { n: 2, prompt_file: prompts/02.md }
  - { n: 3, prompt_file: prompts/03.md }
  - { n: 4, prompt_file: prompts/04.md }
oracle:
  # The seed's own behaviour on every step; each feature from the step that asks for it (M-Q1); the rejection's
  # reason from the rework's step (M-E4's evidence, S10.md §7).
  suites:
    - { id: core, dir: oracle/core, after_steps: [1, 2, 3, 4] }
    - { id: discounts, dir: oracle/discounts, after_steps: [1, 2, 3, 4] }
    - { id: export, dir: oracle/export, after_steps: [2, 3, 4] }
    - { id: export-privacy, dir: oracle/export-privacy, after_steps: [3, 4] }
    - { id: shipping, dir: oracle/shipping, after_steps: [4] }
  # M-E3 per approval event (S10.md §7): who, the verdict and its subject, recorded at the verdict's step.
  checks:
    - oracle/checks/m-e3-step-1-approval.yaml
    - oracle/checks/m-e3-step-2-rejection.yaml
    - oracle/checks/m-e3-step-3-approval.yaml
holdout: true
