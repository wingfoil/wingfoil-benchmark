# Project DNA (P2.4) — scaffolded by `wingfoil init` (Kanban template).
# Structural map of the project: modules, stacks, team + roles, resource paths. Customize freely.
# `version` is this file's content revision; `format` the file format it is written in (bumped by
# WingFoil only on a backward-incompatible change).
version: 1.1
format: 1

project:
  name: order-service
  description: "Order and inventory service behind the web shop: catalogue, stock, orders, discounts and coupons, VAT, shipping, cancellations, invoices. TypeScript library, no runtime dependency."
  methodology: Kanban        # Continuous-flow delivery; work-in-progress limits are declared per state with `limits:` in memory.yaml.

# Modules — the parts of the system (anatomy for navigation). Add your own.
modules:
  - name: public-api
    path: src/index.ts
    description: The public API; everything a consumer may use is exported here. createShop() in src/shop.ts wires a shop together.
  - name: money
    path: src/money.ts
    description: Integer euro cents, half-up rounding, proportional allocation, euro formatting.
  - name: dates
    path: src/dates.ts
    description: YYYY-MM-DD calendar days, validation, comparison, day arithmetic.
  - name: catalogue
    path: src/catalog.ts
    description: Products, case-insensitive trimmed SKUs, VAT class, weight, active/inactive.
  - name: inventory
    path: src/inventory.ts
    description: On-hand and reserved stock, movements, low-stock threshold.
  - name: orders
    path: src/orders.ts
    description: Order placement, numbering, shipping, cancellation (14-day window), quotes.
  - name: pricing
    path: src/pricing.ts
    description: Line and order totals, combining volume discounts, coupon, shipping and VAT.
  - name: discounts-and-coupons
    path: src/discounts.ts
    description: Volume discount and 50% cap (discounts.ts); coupon validity, minimums, single-use (coupons.ts).
  - name: shipping-and-tax
    path: src/shipping.ts
    description: Weight-band parcel cost and free-shipping threshold (shipping.ts); VAT classes and rates (tax.ts).
  - name: invoices-and-reports
    path: src/invoices.ts
    description: Per-year invoice numbering and VAT summary; receipt.ts and reports.ts (stock and sales reports).
  - name: errors
    path: src/errors.ts
    description: ShopError hierarchy.

# Stacks — technologies + methodologies in use. The methodologies come from the Kanban template.
stacks:
  # Each technology is a {name, category} entry: `category` is required (free text: language,
  # runtime, framework, database, ...); `version` and `notes` are optional. To declare one, replace
  # `technologies: []` with a list like this example, uncommented:
  # technologies:
  #   - name: TypeScript
  #     category: language
  # or run: wingfoil dna add stacks.technologies --value TypeScript --entry-category language
  technologies:
    - name: TypeScript
      category: language
      notes: strict mode, ESM (NodeNext), erasableSyntaxOnly (no enums or parameter properties), relative imports with .ts extension
    - name: Node.js
      category: runtime
      version: "22.18+"
      notes: runs .ts directly; no build step, no runtime dependencies
    - name: node:test
      category: test framework
      notes: "npm test = node --test \"test/*.test.ts\"; assertions from node:assert/strict"
  methodologies:
    - name: Kanban
    - name: Specification by Example (BDD)
    - name: TDD

# Team & roles — AI agents execute as developer/reviewer/qa/architect and never hold approval authority.
team:
  members:
    - name: Benchmark Approver
      email: approver@benchmark.localhost
      roles: [approver]
  # AI agents: the roles each one executes as (never approver: agents hold no approval authority), its
  # commit identity (`email`, written in the Co-Authored-By trailer of the commits it co-authors) and
  # the adapter under .wingfoil/agents/ that `wingfoil agent execute` launches it with (`email` is
  # required with `adapter`). To declare one, replace `agents: []` with a list like this example,
  # uncommented:
  # agents:
  #   - name: claude
  #     email: noreply@anthropic.com
  #     executes_as: [ developer, reviewer, qa, architect ]
  #     approval_authority: false
  #     adapter: claude-code
  # or run: wingfoil dna add team.agents --value claude --entry-adapter claude-code --entry-email noreply@anthropic.com --entry-executes_as developer,reviewer
  agents: []
  roles:
    - name: developer
    - name: reviewer
    - name: qa
    - name: architect
    - name: product-owner
    - name: tech-lead
    - name: approver

# Resource paths — query categories used to navigate the project.
# `runs` holds exactly one directory: the agent run log, one <element-id>.jsonl per element.
paths:
  sources: [src/]
  tests: [test/]
  docs: [README.md, docs/]
  config: [.wingfoil]
  governance: [.wingfoil/directives/]
  runs: [docs/runs/]
