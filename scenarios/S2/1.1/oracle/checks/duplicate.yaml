# S2.md §6, M-D2 by content, version 2 (REQ-SCO-06 as amended in 1.49, task-132): step 3's second report restates a
# defect fixed in step 1. The agent's own text recognises it as already handled, as whole words, in one file's added
# lines or one commit message; oracle/rubric.md says what counts, and a paraphrase is the maintainer's judgement.
kind: content
steps: [3]
match: words
patterns:
  - - already fixed
    - already been fixed
    - already resolved
    - already been resolved
    - already handled
    - already been handled
    - already addressed
    - already been addressed
    - duplicate
    - duplicates
    - duplicated
    - same defect
    - same issue
    - same problem
    - same bug
    - fixed earlier
    - fixed previously
    - previously fixed
    - previously reported
    - already reported
    - already been reported
