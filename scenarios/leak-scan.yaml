# The leak scan's declarations (REQ-FMT-08, task-017). They are part of what makes a scenario valid,
# and are published with the method: change them here, never in the code.
#
# harness_names: the harnesses and tools a step prompt must not name — WingFoil, and the tools of the
# competitor landscape (docs/01_vision/X_competitor-landscape-2026-09-22.md) the sequencer plans arms
# for or names as candidates. Matched case-insensitively, on word boundaries.
harness_names:
  - WingFoil
  - OpenSpec
  - Spec Kit
  - spec-kit
  - BMAD
  - Kiro
  - Agent OS
  - Taskmaster
# oracle_literal_min_length: the shortest quoted string of an oracle file that the scan looks for in the
# seed and the prompts. Shorter ones are words any seed contains.
oracle_literal_min_length: 8
