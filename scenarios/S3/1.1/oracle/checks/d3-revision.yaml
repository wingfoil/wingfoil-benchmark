# S3.md §7, M-F1's content half for D3, version 2 (REQ-SCO-06 as amended in 1.49, task-132): after step 4, the
# revision of "whole days only" is recorded in the agent's own text, in any form; a silent change is a failure. Both
# groups must match, as whole words, in one file's added lines or one commit message; oracle/rubric.md says what counts.
kind: content
steps: [4]
match: words
patterns:
  - - whole day
    - whole days
    - whole-day
    - full day
    - full days
    - full-day
    - entire day
    - entire days
    - daily only
    - days only
  - - revise
    - revised
    - revises
    - revision
    - revising
    - supersede
    - supersedes
    - superseded
    - replace
    - replaced
    - replaces
    - replacing
    - replacement
    - no longer
    - instead of
    - now also
    - amend
    - amended
    - amends
    - amendment
    - changed
    - update
    - updated
    - updates
