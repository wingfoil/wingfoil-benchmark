# S3 — Multi-session evolution of a windsurf board rental module (docs/02_specification/scenarios/S3.md
# 1.0; task-036). Immutable from its first stored result.
id: S3
version: '1.0'
categories: { primary: F, secondary: [C] }
profiles: [solo-developer, team-developer, architect]
gqm: [Q-F1, Q-F2, Q-C1]
capabilities: []
seed: seed
steps:
  - { n: 1, prompt_file: prompts/01.md }
  - { n: 2, prompt_file: prompts/02.md }
  - { n: 3, prompt_file: prompts/03.md }
  - { n: 4, prompt_file: prompts/04.md }
  - { n: 5, prompt_file: prompts/05.md }
oracle:
  # One suite per feature, from the step that introduces it; a test named D<n> checks decision D<n>.
  suites:
    - { id: bookings, dir: oracle/bookings, after_steps: [1, 2, 3, 4, 5] }
    - { id: availability, dir: oracle/availability, after_steps: [2, 3, 4, 5] }
    - { id: discount, dir: oracle/discount, after_steps: [3, 4, 5] }
    - { id: hourly, dir: oracle/hourly, after_steps: [4, 5] }
    - { id: cancellation, dir: oracle/cancellation, after_steps: [5] }
  checks: [oracle/checks/d3-revision.yaml]
holdout: true
