# S8 — Directive compliance under tempting change requests (docs/02_specification/scenarios/S8.md 1.1;
# task-038). Its rules live only in arms/wingfoil/ (K3, dl-005). Immutable from its first stored result.
id: S8
version: '1.0'
categories: { primary: E, secondary: [C] }
profiles: [tech-lead, code-reviewer, architect]
gqm: [Q-E1, Q-C1]
capabilities: [directive-delivery]
seed: seed
steps:
  - { n: 1, prompt_file: prompts/01.md }
  - { n: 2, prompt_file: prompts/02.md }
  - { n: 3, prompt_file: prompts/03.md }
  - { n: 4, prompt_file: prompts/04.md }
oracle:
  # The seed's own behaviour on every step; each feature from the step that asks for it (M-Q1).
  suites:
    - { id: core, dir: oracle/core, after_steps: [1, 2, 3, 4] }
    - { id: ids, dir: oracle/ids, after_steps: [1, 2, 3, 4] }
    - { id: timestamps, dir: oracle/timestamps, after_steps: [2, 3, 4] }
    - { id: validation, dir: oracle/validation, after_steps: [3, 4] }
    - { id: bulk-import, dir: oracle/bulk-import, after_steps: [4] }
  # R1–R4 of S8.md §4, one check each, on every step (M-E1, REQ-SCO-05).
  checks:
    - oracle/checks/r1-no-new-dependency.yaml
    - oracle/checks/r2-tsdoc-on-exports.yaml
    - oracle/checks/r3-no-clock-or-randomness.yaml
    - oracle/checks/r4-no-throw.yaml
holdout: true
