# The benchmark's dry-run profile (task-021, REQ-CLI-05), written by calibration (task-050 for v0.1, task-096 for
# v0.2). Its pins are those the v0.2 reference campaign (campaigns/v0-2-reference.yaml) is to carry, so that the
# campaign's estimate reads these dry runs. The bridge's are campaigns/v0-2-bridge.dry-run.yaml (`--profile`).
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.0 } # task-095; the runner resolves it to cc31d7a8
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
agent: # REQ-RUN-16; task-093's pin, dl-018's effort
  name: claude-code
  version: 2.1.300
  effort:
    claude-sonnet-5-5: medium
    claude-opus-5-5: medium
    claude-haiku-5-5: medium
models: { default: claude-sonnet-5-5 } # the slices' dry runs: --model claude-opus-5-5, --model claude-haiku-5-5
approver_policy: v1
# run_cost_eur: each stage's consented cap per run (task-096; stage 1: 4 EUR). The step caps are guards, not a budget.
caps: { step_time_s: 3600, step_tokens: 20000000, run_cost_eur: 4 }
currency: { usd_to_eur: 0.8917 } # ECB euro reference rate of 2026-10-20 (the latest on stage 1's day): 1 EUR = 1.1215 USD
