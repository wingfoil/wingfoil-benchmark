# The benchmark's dry-run profile (task-021, REQ-CLI-05), written by calibration (task-050 for v0.1, task-096 for
# v0.2). Its pins are those the v0.2 reference campaign (campaigns/v0-2-reference.yaml) is to carry, so that the
# campaign's estimate reads these dry runs. The bridge's are campaigns/v0-2-bridge.dry-run.yaml (`--profile`). Since
# task-151 it also pins a review loop, which that campaign does not: every dry run on it runs and pays for a loop too.
harnesses:
  wingfoil: { tool: wingfoil, version: v0.3.0 } # task-095; the runner resolves it to cc31d7a8
  speckit: { tool: speckit, version: v1.1.0 }
  openspec: { tool: openspec, version: 1.14.0 }
agent: # REQ-RUN-16; task-093's pin, dl-018's effort
  name: claude-code
  version: 2.1.300
  effort:
    claude-sonnet-5-5: medium
    claude-opus-5-5: medium
    claude-haiku-5-5: medium
models: { default: claude-sonnet-5-5 } # the slices' dry runs: --model claude-opus-5-5, --model claude-haiku-5-5
approver_policy: v1
# The caps: the campaigns' after calibration (task-096); each stage's own are in the dry runs' stored profiles.
caps: { step_time_s: 1800, step_tokens: 10000000, run_cost_eur: 5 }
currency: { usd_to_eur: 0.8917 } # ECB euro reference rate of 2026-10-20 (the latest on stage 1's day): 1 EUR = 1.1215 USD
# The review loop (task-151, REQ-CLI-05 as amended in 1.58): the approver's choice 2 of 2026-11-13 (task-147), the
# reviewer the same in every arm; a dry run then measures the loop the estimate prices (REQ-CLI-02 as amended in 1.58).
review_loop:
  agent: { name: claude-code, version: 2.1.300 }
  model: claude-sonnet-5-5
  effort: medium
  prompt: { file: review/prompt.md, sha256: c8bce4bd9083d33c7953fb6f4cba77da07661f4952d900bbe98bf79a86991983 }
  fixer_prompt:
    file: review/fixer-prompt.md
    sha256: 47fcee47291cde67557ee717b7817c3721dadde8410001b0b26bcc446a9ec223
  max_rounds: 5
  caps: { session_time_s: 1800, session_tokens: 10000000, session_cost_eur: 2, fixer_interventions: 5 }
