# The benchmark's dry-run profile (task-021, REQ-CLI-05), written by calibration (task-050). Its pins are
# those the v0.1 reference campaign is to carry, so that the campaign's estimate reads these dry runs.
harnesses:
  wingfoil: { tool: wingfoil, version: v0.2.2 } # task-049; the runner resolves it to 12537b62
agent: { name: claude-code, version: 2.1.280 } # REQ-RUN-16 as amended; the approver, 2026-10-02
models: { default: claude-sonnet-5 } # the Opus slice's dry runs: --model claude-opus-5
approver_policy: v1
# run_cost_eur: each stage's consented cap per run (task-050). The step caps are guards, not a budget.
caps: { step_time_s: 1800, step_tokens: 20000000, run_cost_eur: 2.5 }
currency: { usd_to_eur: 0.8851 } # ECB euro reference rate of 2026-10-01: 1 EUR = 1.1298 USD
