# The speckit arm (experiment design 1.2 §2, REQ-FMT-05, REQ-RUN-18): the agent with GitHub Spec Kit at the campaign's
# pin, installed from its wheel bundle and initialized as its documentation says for Claude Code (its skills). Its
# workflow engine, which would start the agent itself, is not used (task-065; decided at rel-v0-2's triage).
name: speckit
setup: setup.sh
manual: manual.md
requires: speckit
# Spec Kit v1.1.0 has no telemetry to turn off (task-065: no telemetry or analytics in its source; install and init ran
# with no network).
telemetry_off: []
# The harness capabilities of Spec Kit v1.1.0 (REQ-FMT-10): the scenario's project rules reach it through its
# constitution (REQ-FMT-14); no memory life cycle, no workflow engine in use, no MCP tools. Re-assessed when the pin
# changes.
provides:
  directive-delivery: true
  memory-lifecycle: false
  workflow-engine: false
  mcp-tools: false
