# The speckit arm (experiment design 1.2 §2, REQ-FMT-05, REQ-RUN-18): the agent with GitHub Spec Kit at the campaign's
# pin, installed from its wheel bundle and initialized as its documentation says for Claude Code (its skills). Its
# workflow engine, which would start the agent itself, is not used (task-065; decided at rel-v0-2's triage).
name: speckit
setup: setup.sh
manual: manual.md
requires: speckit
# Spec Kit v1.1.0 has no telemetry to turn off (task-065: no telemetry or analytics in its source; install and init ran
# with no network).
telemetry_off: []
# The harness capabilities of Spec Kit v1.1.0 (REQ-FMT-10): the scenario's project rules reach it through its
# constitution (REQ-FMT-14); no memory life cycle, no workflow engine in use, no MCP tools. Re-assessed when the pin
# changes.
provides:
  directive-delivery: true
  memory-lifecycle: false
  workflow-engine: false
  mcp-tools: false
# The configuration and state places (REQ-FMT-05 as amended in 1.50, task-140), read from Spec Kit v1.1.0 (the wheel
# specify_cli 1.1.0: its METADATA, its installed skills and its code), the version the configuring profile pins. The
# scripts, templates and manifests init installs are the tool's own files, refreshed by it: not configuration, which
# goes in the documented places (the constitution; template overrides, presets and extensions; the init options).
configuration:
  - glob: .specify/memory/constitution.md
    source: the speckit-constitution skill (.claude/skills/speckit-constitution/SKILL.md, as init installs it)
  - glob: .specify/templates/overrides/**
    source: .specify/scripts/bash/common.sh's template resolution (overrides first); METADATA, Customize
  - glob: .specify/presets/**
    source: .specify/scripts/bash/common.sh's template resolution (preset layers)
  - glob: .specify/extensions/**
    source: .specify/scripts/bash/common.sh's template resolution (extension layers)
  - glob: .specify/extensions.yml
    source: every installed skill's hook check (.claude/skills/speckit-*/SKILL.md)
  - glob: .specify/workflows/**
    source: specify_cli/workflows/_commands.py and engine.py (workflow definitions and registry)
  - glob: .specify/init-options.json
    source: the speckit-specify skill (init options, such as feature numbering)
  - glob: .specify/integration.json
    source: the speckit-specify skill; specify_cli/integrations/claude/__init__.py
  - glob: .claude/skills/speckit-*/**
    source: specify_cli/integrations/claude/__init__.py (the agent's skills, .claude/skills/<name>/SKILL.md)
state:
  - glob: specs/**
    source: "the speckit-specify skill (each feature's directory: spec, plan, tasks)"
  - glob: .specify/feature.json
    source: the speckit-specify skill (the current feature)
  - glob: .specify/workflows/runs/**
    source: specify_cli/workflows/engine.py (a workflow's run state)
  - glob: .specify/bugs/**
    source: METADATA (bug reports)
  - glob: .specify/assessments/**
    source: METADATA (assessments)
