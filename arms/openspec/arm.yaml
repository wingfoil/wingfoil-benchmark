# The openspec arm (REQ-FMT-05, REQ-RUN-18, task-071): the agent with OpenSpec at the campaign's pin, installed from its
# registry artifact and initialized as its documentation says for Claude Code (task-070's spike).
name: openspec
setup: setup.sh
manual: manual.md
requires: openspec
# OpenSpec sends telemetry by default; OPENSPEC_TELEMETRY=0 turns it off, and its version check against the npm
# registry with it (dist/telemetry/opt-out.js, task-070).
telemetry_off: [OPENSPEC_TELEMETRY=0]
# The harness capabilities of OpenSpec 1.14.0 (REQ-FMT-10, task-070): the scenario's project rules reach it in
# openspec/config.yaml's context (REQ-FMT-14); its CLI checks a change's state, and no engine of its own runs the
# agent; no memory life cycle, no MCP tools. Re-assessed when the pin changes.
provides:
  directive-delivery: true
  memory-lifecycle: false
  workflow-engine: false
  mcp-tools: false
# The configuration and state places (REQ-FMT-05 as amended in 1.50, task-140), read from OpenSpec 1.14.0 (its npm
# package: README and dist), the version the configuring profile pins.
configuration:
  - glob: openspec/config.yaml
    source: the file's own comments, as init writes it; dist/core/openspec-root.js
  - glob: openspec/config.yml
    source: dist/core/openspec-root.js and dist/core/init.js (the accepted spelling)
  - glob: openspec/schemas/**
    source: dist/core/artifact-graph/resolver.js (the project's schemas, resolved first)
  - glob: .claude/commands/opsx/**
    source: dist/core/config.js (the agent's commands init installs for Claude Code)
  - glob: .claude/skills/openspec-*/**
    source: dist/core/config.js (the agent's skills init installs for Claude Code)
state:
  - glob: openspec/changes/**
    source: README (changes, their archive included)
  - glob: openspec/specs/**
    source: README (the accepted specs)
