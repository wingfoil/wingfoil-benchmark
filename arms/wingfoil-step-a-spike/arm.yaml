# The step-A spike arm (task-107; dl-021 step A, dl-027): WingFoil at the campaign's pin (v0.3.1), set up as the
# wingfoil arm, plus one workflow instance opened by the setup; its manual has the session agent drive WingFoil's
# workflow cycle. A spike only, on the task branch: never a campaign's arm.
name: wingfoil-step-a-spike
setup: setup.sh
manual: manual.md
mcp: mcp.json
requires: wingfoil
# WingFoil v0.3.1 sends no telemetry (as v0.3.0; re-read in task-107's admission).
telemetry_off: []
provides:
  directive-delivery: true
  memory-lifecycle: true
  workflow-engine: true
  mcp-tools: false
