# The wingfoil arm (experiment design §2, REQ-FMT-05): the agent with WingFoil at the campaign's pin,
# initialized and configured, with its MCP server (adr-003).
name: wingfoil
setup: setup.sh
manual: manual.md
mcp: mcp.json
requires: wingfoil
# The harness capabilities of WingFoil v0.2.2 (K5, REQ-FMT-10; task-030 for 3df305e, re-assessed on v0.2.2 in
# task-049, the same four): directives bound to roles and the memory life cycle; no workflow engine and no MCP
# Tools. Re-assessed when the pinned WingFoil changes.
provides:
  directive-delivery: true
  memory-lifecycle: true
  workflow-engine: false
  mcp-tools: false
