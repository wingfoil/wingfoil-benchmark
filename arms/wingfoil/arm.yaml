# The wingfoil arm (experiment design §2, REQ-FMT-05): the agent with WingFoil at the campaign's pin,
# initialized and configured, with its MCP server (adr-003). Step A (dl-021, task-114): on WingFoil v0.3.1, the setup
# opens one workflow instance and the manual has the session agent drive the workflow's cycle. The v0.2 manual's arm,
# on v0.3.0, is read from history by the digest its campaigns pin (REQ-FMT-13 as amended in 1.33).
name: wingfoil
setup: setup.sh
manual: manual.md
mcp: mcp.json
requires: wingfoil
# WingFoil v0.3.1 sends no telemetry, as v0.3.0 and v0.2.2 did not: nothing to turn off (REQ-FMT-05 as amended;
# task-095 read v0.3.0's source at cc31d7a8, task-107 re-read it at v0.3.1's 870bd440: no network call but npm's own).
telemetry_off: []
# A scenario's scripted verdict carried out through WingFoil's own approval verb, under the scenario's approver
# (REQ-FMT-05 as amended in 1.44, task-118, dl-029 option (b1)); only a scenario with a separate approver uses it.
verdict_hook: verdict.sh
# The harness capabilities of WingFoil v0.3.1 (K5, REQ-FMT-10; task-030 for 3df305e, task-049 for v0.2.2, task-095 for
# v0.3.0, re-read on v0.3.1 in task-107's admission and task-114): directives bound to roles and the memory life cycle;
# a workflow engine (`workflow start|next|status|finalize|end`, which records and routes a workflow's steps from Memory
# at HEAD, and executes none), which this arm's agent now drives; still no MCP Tools (`tools/list` answers []).
# Re-assessed when the pinned WingFoil changes. The bridge's arm keeps v0.2.2's capabilities, read from history
# (REQ-FMT-13 as amended in 1.33).
provides:
  directive-delivery: true
  memory-lifecycle: true
  workflow-engine: true
  mcp-tools: false
# The configuration and state places (REQ-FMT-05 as amended in 1.50, task-140), read from WingFoil v0.3.1's
# documentation, the version the configuring profile pins: everything WingFoil keeps as its configuration lies under
# .wingfoil/ (its five pillars' table; spec-011: no subpath of .wingfoil/ is excluded, git being the only store), the
# scenario's directives (.wingfoil/directives/custom/), dna.yaml and roles.yaml included. Its Memory, where a workflow
# instance is recorded too, and its run log are state. WingFoil writes nothing under .claude/; the arm's MCP server is
# attached by the runner (mcp.json), so .mcp.json is not a place.
configuration:
  - glob: .wingfoil/**
    source: >-
      docs/user-guide.md §0 (the five pillars' table) and §3;
      docs/04_memory/design/specs/spec-011-storage-layout.md
state:
  - glob: docs/memory/**
    source: docs/user-guide.md §0 (Memory, docs/memory/<type>/<id>.md) and §7 (workflow start records a plan document)
  - glob: docs/runs/**
    source: docs/user-guide.md §4.3 (paths.runs, which init declares as docs/runs/) and §9.4
