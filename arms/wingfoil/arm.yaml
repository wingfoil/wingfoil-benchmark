# The wingfoil arm (experiment design §2, REQ-FMT-05): the agent with WingFoil at the campaign's pin,
# initialized and configured, with its MCP server (adr-003).
name: wingfoil
setup: setup.sh
manual: manual.md
mcp: mcp.json
requires: wingfoil
# The harness capabilities of WingFoil 3df305e (K5, REQ-FMT-10, task-030): directives bound to roles and
# the memory life cycle; no workflow engine and no MCP Tools. Re-assessed when the pinned WingFoil changes.
provides:
  directive-delivery: true
  memory-lifecycle: true
  workflow-engine: false
  mcp-tools: false
