# Copy to config/runner.local.yaml (git-ignored) and fill this machine's paths. The home and the line are clones of
# origin outside every working checkout: no agent works in the home, and the line is where the runner's agents do.
lines:
  trunk:
    checkout: ~/<runner lines>/wingfoil-benchmark-trunk
    worktrees: ~/<runner lines>/wingfoil-benchmark-worktrees/trunk
paths:
  runner: ~/<runner homes>/wingfoil-benchmark
