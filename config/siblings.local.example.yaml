# Copy to config/siblings.local.yaml (git-ignored), in the main checkout, and fill this machine's paths (task-179).
# The tests and scripts/full-suites.sh read it when BENCH_WINGFOIL_REPO or BENCH_HOLDOUT_PATH is not set; a worktree
# reads the main checkout's file. A relative path is read against the main checkout, ~/ against the home folder.
# The hold-out may be left out when it sits beside the main checkout as wingfoil-benchmark-holdout.
wingfoil: ~/<workspace>/<the WingFoil clone>
holdout: ~/<workspace>/<the hold-out>
