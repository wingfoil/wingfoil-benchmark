# The external workflow runner's configuration for this repository's governance (task-127, task-177; dl-037),
# from the runner package's config/wingfoil-benchmark.runner.yaml at runner-1.2.2, checked against the composed
# workflows (`npx --no-install wingfoil workflow show work-item`). This machine's paths (the line's checkout and
# worktrees, paths.runner, paths.trusted_ref while a change is unmerged) live in config/runner.local.yaml, which is
# git-ignored. test/unit/docs/runner-config.test.ts holds what it may launch and who it signs as.
format: 1
schedule_minutes: 10
push: false
notify: notify-send
notices:
  paths: relative
limits:
  lock_stale_minutes: 120
  step_timeout_minutes: 45
  errors_in_a_row: 3
  review_rejections: 2
  max_load: 0.8
  log_repeat_minutes: 60
  usage_limit_wait_minutes: 30
weekly_mains: []
worktree_types:
  - task
  - bug
line_branches:
  actions:
    - memory.add
  workflows:
    - sync
    - branch
    - converge
push_workflows:
  - sync
  - branch
# Claude only: no line runs Codex (task-177's Design).
adapter_extra_args:
  claude-opus: &claude
    position: end
    args:
      - --add-dir
      - '{checkout}'
  claude-sonnet: *claude
# Only work-item runs by itself; its real-agent check spends and is started by the approver. campaign-cycle and the
# release slot are never launched (the test above).
launch:
  allow:
    - work-item
  manual:
    - work-item.real-agent-check
phases:
  integrate:
    - work-item.done
  raising: []
integration:
  merge: no-ff
  update: merge
  task_branch: task/{id}
# Every role of .wingfoil/dna.yaml but the approver, which is the approver's alone.
roles:
  product-owner: high
  architect: high
  reviewer: high
  tech-lead: high
  scenario-author: high
  facilitator: intermediate
  developer: intermediate
  qa: intermediate
permissions:
  extra:
    - Bash(npm ci:*)
    - Bash(npx tsc:*)
    - Bash(node --test:*)
    - Bash(node scripts/checks/:*)
lines:
  trunk:
    branch: main
    release_line: rl-001
    # The runner's own identity (a team.agents entry, approval_authority: false); the launched model is credited by
    # the Co-Authored-By trailer. No reviewer agent: Claude reviews in another session (distinct by session id).
    agent: WingFoil Benchmark Runner
    weekly_token_budget: null
    tiers:
      high: claude-opus
      intermediate: claude-sonnet
