# The setup contest form (REQ-RES-10, F7.2, task-073; a configuration, as amended in 1.50, task-146): each harness
# arm's setup page links it.
name: Contest an arm's setup
description: Say where a harness arm is not set up as its tool's official documentation says, and how to correct it.
title: 'Setup contest: <arm>'
labels: [setup-contest]
body:
  - type: markdown
    attributes:
      value: >-
        Each harness arm is set up from its tool's official documentation, and its setup page publishes how. A
        correction the maintainer accepts changes the arm's files, so its digest: it runs as a new campaign, and the
        contested campaign stays published, its setup page linking this contest and the campaign that followed. A
        configured arm's configuration is scenario content, written by the configuring agent the method page states:
        a correction accepted there changes the configuring prompt, its profile or the arm, and every harness's
        configuration is written again in a new scenario version, run as a new campaign; the contested values stay
        published too.
  - type: dropdown
    id: arm
    attributes:
      label: The arm
      description: The harness arm whose setup you contest, as its setup page names it.
      options: [wingfoil, speckit, openspec, wingfoil-configured, speckit-configured, openspec-configured]
    validations:
      required: true
  - type: dropdown
    id: subject
    attributes:
      label: What is contested
      description: >-
        The setup (the setup script, the manual, the rules, the docs control) or, for a configured arm, the
        configuration its scenario version holds, as the method page lists it.
      options: [the setup, the configuration]
    validations:
      required: true
  - type: textarea
    id: step
    attributes:
      label: The setup step contested
      description: >-
        Where on the setup page: a line of the setup script, the telemetry setting, the operating manual, the rules
        written for the tool, or what its docs control gets.
    validations:
      required: true
  - type: textarea
    id: documentation
    attributes:
      label: What the tool's official documentation says
      description: Quote it, with the link and the version it applies to.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: The proposed correction
      description: What the arm's files should do instead.
    validations:
      required: true
