# Project DNA (P2.4) — scaffolded by `wingfoil init` (Kanban template).
# Structural map of the project: modules, stacks, team + roles, resource paths. Customize freely.
version: 1

project:
  name: "WingFoil Benchmark"
  description: >-
    Benchmark suite that measures where WingFoil makes a difference in AI-assisted software
    development, by running the same scenarios with plain AI agents, with WingFoil and with
    competing tools, and comparing quality, cost and determinism. Results are published on
    GitHub Pages and linked from the WingFoil README.
  methodology: Kanban        # Continuous-flow delivery with work-in-progress limits.

# Modules — the parts of the system (anatomy for navigation). Add your own.
modules:
  - name: core
    path: src/core
    description: "Types, Result/Issue and the Zod schemas of every human-authored file (REQ-ARC-01)."
  - name: scenario
    path: src/scenario
    description: "Loads scenarios/<id>/<version>/ and checks it against the scenario schema (F3.1)."
  - name: campaign
    path: src/campaign
    description: "Loads campaigns/<name>.yaml, checks pins and consistency, computes its identity (F1.1)."
  - name: results
    path: src/results
    description: "The results/<campaign-id>/<n>/ layout: execution numbering (REQ-FMT-02, REQ-FMT-06)."
  - name: cli
    path: src/cli
    description: "The bench command (REQ-CLI); today 'bench campaign validate'."

# Stacks — technologies + methodologies in use. The methodologies come from the Kanban template.
stacks:
  technologies:
    - { name: TypeScript, category: language }
    - { name: Node.js, category: runtime, version: "22.12+" }
    - { name: npm, category: package-manager }
    - { name: Docker, category: isolation, notes: "every scenario run executes in an isolated container" }
    - { name: Claude Code, category: agent-under-test, notes: "first agent; headless runs report token usage" }
    - { name: GitHub Pages, category: publishing, notes: "published benchmark results" }
  methodologies:
    - name: Kanban
    - name: Lean Inception
    - name: Goal-Question-Metric (GQM)
    - name: Specification by Example (BDD)
    - name: TDD

# Team & roles — AI agents execute as developer/reviewer/qa/architect and never hold approval authority.
team:
  members:
    - name: Roberto Pompermaier
      email: robypomper@gmail.com
      roles: [approver, product-owner, facilitator, tech-lead, scenario-author]
  agents:
    - name: Claude Code
      executes_as: [developer, reviewer, qa, architect, facilitator, scenario-author]
      approval_authority: false
  roles:
    - name: developer
    - name: reviewer
    - name: qa
    - name: architect
    - name: product-owner
    - name: tech-lead
    - name: facilitator
    - name: scenario-author     # designs benchmark scenarios, their seeds and oracles
    - name: approver

# Resource paths — query categories used to navigate the project.
paths:
  sources: [src]
  tests: [test]
  docs: [docs, README.md]
  config: [.wingfoil]
  governance: []
