# work-item, this repository's copy of methodology/kanban 1.0.0's (task-127, docs/pack-deviations.md D3): the
# pack's five steps, each carrying the delivery rules of the retired kanban-delivery (version 6), and a manual
# real-agent check. The steps' keys are the pack's, so the external workflow runner and WingFoil's engine find them.
# The WIP limits (in-progress 1, in-review 1) are memory.yaml's `limits` on task, enforced by WingFoil.
# A task enters the flow at backlog: its pending → backlog gate (the approver accepts it) is outside this workflow,
# as in the pack; a task that runs the real agent states its model and ceiling in its Context, and that approval is
# the consent (dl-006).
format: 1
name: work-item
kind: sub
element: task
description: "One task, from backlog to done, under the benchmark's delivery rules"
version: 1
phases:
  - name: start
    description: >-
      Classify every acceptance criterion (red-first or characterization), write the Design section, declare in
      `fixes` the bugs the task fixes, open branch task/<id> in a worktree of its own, and pull the task
      (backlog → in-progress); WingFoil refuses it when the limit on in-progress is reached.
    role: developer
    actions:
      - memory.submit
  - name: build
    description: >-
      Implement test-first: a red test precedes the code of every red-first criterion; acceptance tests run
      against the scripted fake agent. Figures in notes come from a script whose command is quoted, never typed.
    role: developer
    actions:
      - agent.execute
  - name: review
    description: >-
      Typecheck, lint and the tests the change touches green, run at the lowest priority (`nice -n 19 ionice -c3`,
      vitest with 2 workers); traceability (features, acceptance, requirements) checked; every `wingfoil`
      command's declared-vs-observed note present. An independent, read-only agent (a fresh session or subagent,
      not the one that built the task, with no file-editing tools; it may run read-only and test commands)
      reviews the task's branch against its Design, the requirements it names and its acceptance scenarios. Every
      finding carries a severity: blocker, should-fix or nit. Every finding is fixed on the branch or recorded as
      a bug or a decision-log. A round with a blocker or a should-fix is followed by a re-review, by an
      independent agent, of the fix's diff only; a round with nits only closes the review: the nits are fixed and
      listed, with no new round, but a nit whose fix changes code, a test or a script gets a quick check of that
      diff. Before every round the author runs the post-fix checklist (search the Design, the notes, the
      requirements and the README for every term the fix changed; re-read every line it removed; a red test for
      each blocker or should-fix, with the edge cases beside it; figures in notes generated, never typed) and
      `scripts/pre-review.sh main`; a task's diff stays under about 1 200 lines, split at its Design when larger.
      The rounds, their reviewer, every finding's severity and outcome are recorded in a `### Review` subsection
      of the task's Execution notes, one entry per round (dl-020). Then, never on a self-review, in-progress →
      in-review, within the limit on in-review. The practice since v0.3, which task-167 writes down, adds: the
      reviewer works in a temporary directory of its own, never in the main checkout, whose reflog is checked
      after every round; a short final review reads the final diff; and task-167 weighs moving the full suites
      before in-review.
    role: reviewer
    actions:
      - memory.submit
  - name: approve
    description: >-
      The full suites — lint, unit and acceptance tests with coverage above 80%, test:bin and test:docker — are
      run by the agent with `scripts/full-suites.sh`, on demand, when the approver says the machine is free or
      asks for them, on the task's branch at the commit offered for approval, its worktree clean (no DIRTY mark);
      their log and that commit are named in the Review notes and in the approval command handed over (dl-016).
      The approver accepts on a green log and a clean independent review (→ approved) or sends the task back to
      build (→ in-progress), a red log included, which starts a new round of build and independent review.
    role: approver
    actions:
      - memory.approve
    approval: { by_role: approver }
    fallback: { step: build }
  - name: done
    description: >-
      Merge task/<id> into main with --no-ff, then approved → done. For each bug in the task's `fixes`: commit by
      hand `fixed_by: <task id>` and the bug's Resolution section naming the task (`docs(bug): <bug> fixed by
      <task>`), then submit the bug approved → fixed; between the task's `done` and the bug's `fixed` the
      traceability test is red by design; it is green again once every bug is fixed. When the last task of a wave
      is done, check the wave's "Ends with" from the sequencer and record it in the release element. This check,
      with the fake agent, is the one every wave makes; a real-agent half is real-agent-check's, and optional.
    role: developer
    actions:
      - memory.submit
  - name: real-agent-check
    description: >-
      Once per wave, after its last task is done, and only when the release's plan (plan-006 for v0.4) decided it
      for that wave because the wave's "Ends with" names behaviour the fake agent cannot show (a real session, a
      model, a live tool): the real-agent half of the wave check. The approver consents first, with the model and
      a spending ceiling; the campaign then runs outside the repository; its outcome is recorded in the release
      element's wave section (consent date, model, ceiling, campaign id, cost per arm, outcome) and as a line of
      the release's spending ledger, docs/calibration/<version>-ledger.md (dl-006). Never launched by a runner: a
      manual step. It declares no `produces`, since WingFoil 0.3 would read an earlier release's ledger as its
      evidence (D5).
    role: developer
    optional: true
    approval: { by_role: approver }
