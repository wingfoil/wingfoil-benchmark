# work-item, this repository's copy of methodology/kanban 1.0.0's (task-127, docs/pack-deviations.md D3): the
# pack's five steps, each carrying the delivery rules of the retired kanban-delivery (version 6), and a manual
# real-agent check. The steps' keys are the pack's, so the external workflow runner and WingFoil's engine find them.
# The WIP limits (in-progress 1, in-review 1) are memory.yaml's `limits` on task, enforced by WingFoil.
# A task enters the flow at backlog: its pending → backlog gate (the approver accepts it) is outside this workflow,
# as in the pack; a task that runs the real agent states its model and ceiling in its Context, and that approval is
# the consent (dl-006).
format: 1
name: work-item
kind: sub
element: task
description: "One task, from backlog to done, under the benchmark's delivery rules"
version: 1
phases:
  - name: start
    description: >-
      Classify every acceptance criterion (red-first or characterization), write the Design section, declare in
      `fixes` the bugs the task fixes, open branch task/<id> in a worktree of its own, and pull the task
      (backlog → in-progress); WingFoil refuses it when the limit on in-progress is reached.
    role: developer
    actions:
      - memory.submit
  - name: build
    description: >-
      Implement test-first: a red test precedes the code of every red-first criterion; acceptance tests run
      against the scripted fake agent. Figures in notes come from a script whose command is quoted, never typed.
    role: developer
    actions:
      - agent.execute
  - name: review
    description: >-
      Typecheck, lint and the tests the change touches green at the lowest priority; `scripts/pre-review.sh main`
      before every round; traceability (features, acceptance, requirements) checked; every `wingfoil` command's
      declared-vs-observed note present. An independent, read-only agent (not the one that built the task),
      working in a temporary directory of its own and never in the main checkout, reviews the branch against its
      Design, its requirements and its acceptance scenarios; the main checkout's reflog is checked after every
      round. Every finding carries a severity (blocker, should-fix, nit) and is fixed on the branch or recorded as
      a bug or a decision-log; a round with a blocker or a should-fix is followed by a re-review of the fix's diff;
      a nit-only round closes the review, its nits fixed and listed. After the last fix a short final review reads
      the final diff. The rounds are recorded in a `### Review` subsection of the Execution notes (dl-020). The
      full suites (`scripts/full-suites.sh`) run on the branch at the commit offered for approval, when the
      approver says the machine is free (dl-016). Then, never on a self-review, in-progress → in-review, within
      the limit on in-review.
    role: reviewer
    actions:
      - memory.submit
  - name: approve
    description: >-
      The approver approves the task on a green full-suites log at a named commit and a clean independent review;
      a reject sends it back to build (in-progress), which starts a new round of build and review.
    role: approver
    actions:
      - memory.approve
    approval: { by_role: approver }
    fallback: { step: build }
  - name: done
    description: >-
      Merge task/<id> into main with --no-ff, then approved → done. For each bug in the task's `fixes`: commit by
      hand `fixed_by: <task id>` and the bug's Resolution, then submit the bug approved → fixed (the traceability
      test is red between the two by design). When the last task of a wave is done, check the wave's "Ends with"
      and record it in the release element.
    role: developer
    actions:
      - memory.submit
  - name: real-agent-check
    description: >-
      Once per wave, after its last task is done, and only when the wave's "Ends with" names behaviour the fake
      agent cannot show: the real-agent half of the wave check. The approver consents first, with the model and a
      spending ceiling; the campaign then runs outside the repository; its outcome is recorded in the release
      element's wave section and as a line of the release's spending ledger (dl-006). Never launched by a runner:
      a manual step.
    role: developer
    optional: true
    approval: { by_role: approver }
