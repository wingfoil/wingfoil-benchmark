# Capture a bug on demand
name: bug-ingest
kind: main
description: "Capture a bug on demand"
phases:
  - name: capture
    description: "Record the bug: context, expected and actual behaviour, evidence."
    role: developer
    actions:
      - 'memory.add(type: bug)'
      - memory.submit
    produces:
      - "docs/memory/bug/{id}.md"
