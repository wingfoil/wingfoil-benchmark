# Kanban delivery loop (sub-workflow), one iteration per `task` element.
# WIP limits: at most 1 task in-progress and 1 task in-review at any time (a single approver).
# They are not enforced by WingFoil (no workflow engine): the plan phase checks them with
# `npx wingfoil memory search --type task --status in-progress` / `--status in-review`.
# Task machine (memory.yaml): draft → pending (gate) → backlog → in-progress → in-review (gate) →
# approved → done.
name: kanban-delivery
kind: sub
description: "Kanban delivery loop"
element: task
phases:
  - name: plan
    description: >-
      Pick the next work from the sequencer (wave order) within the WIP limits; create the task
      (memory add), fill it (release, wave, features, acceptance, requirements, Context) and submit it
      (draft → pending). The approver accepts it into the backlog (pending → backlog) or rejects it.
    role: product-owner
    actions:
      - memory.add
      - memory.submit            # draft → pending
      - memory.approve           # pending → backlog (approver)
    approval: { by_role: approver }
  - name: design
    description: >-
      Classify every acceptance criterion (red-first or characterization), write the Design section,
      open branch task/<id>, and start the task (backlog → in-progress).
    role: developer
    actions:
      - memory.submit            # backlog → in-progress
  - name: build
    description: "Implement test-first (TDD); acceptance tests run against the scripted fake agent."
    role: developer
  - name: review
    description: >-
      Unit and acceptance tests green, coverage above 80%, lint clean, traceability (features,
      acceptance, requirements) checked, every `wingfoil` command's declared-vs-observed note present.
      Then in-progress → in-review; the approver accepts (→ approved) or sends it back (→ in-progress).
    role: reviewer
    actions:
      - memory.submit            # in-progress → in-review
      - memory.approve           # in-review → approved (approver)
    approval: { by_role: approver }
    fallback: { step: build, set_state: in-progress }
  - name: deliver
    description: >-
      Merge task/<id> into main with --no-ff, then approved → done. When the last task of a wave is
      done, check the wave's "Ends with" from the sequencer and record it in the release element.
    role: developer
    actions:
      - memory.submit            # approved → done
