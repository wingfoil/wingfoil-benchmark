# delivery, this repository's copy of methodology/kanban 1.0.0's (task-127, docs/pack-deviations.md D2): the
# release keeps its planning gate, so plan-release moves it draft → planning with a submit and planning →
# in-development with the approver's approval, instead of two submits.
format: 1
name: delivery
kind: sub
description: "The flow, release by release"
version: 1
phases:
  - name: plan-release
    description: >-
      The Product Owner adds the first open release, its version and release-line given with --set or written in
      the draft: confirm its scope from the sequencer, specify its new features (each wave's specification task),
      triage the open bugs and decision-logs, and create the release's first tasks. The release then moves
      draft → planning (a submit) and planning → in-development once the approver accepts the scope (the
      approval). Later releases are added outside a step with memory add and moved the same way; keep one
      release in-development to carry the flow, and add the next before the current one leaves in-development.
    role: product-owner
    actions:
      - 'memory.add(type: release)'
      - memory.submit
      - memory.approve
    approval: { by_role: approver }
    produces:
      - { type: release, path: "docs/memory/release/{id}.md" }
  - name: releases
    description: >-
      Each open release, with the work items it carries, its release and its retrospective. A
      release already released when the project adopted is never selected.
    iterate_over: release
    where: { status: [in-development, releasing] }
    include: release-flow
