# The end-to-end software life cycle of the benchmark.
# inception and specification ran once (plan-001, plan-002; specification covered release v0.1).
# From then on the benchmark is built one release at a time (release-cycle, iterating over the
# `release` elements v0.1 … v1.0); later releases specify their new features inside release-planning.
name: sw-life-cycle
kind: main
description: "The end-to-end software life cycle"
phases:
  - name: inception
    include: benchmark-inception
  - name: specification
    description: "Specification of release v0.1 (later releases: release-cycle → release-planning)."
    include: benchmark-specification
  - name: release-cycle
    description: "One iteration per sequencer release, in order."
    iterate_over: release
    include: release-cycle
  - name: sunset
