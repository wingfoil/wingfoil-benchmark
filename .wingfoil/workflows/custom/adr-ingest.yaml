# Capture an ADR on demand
name: adr-ingest
kind: main
description: "Capture an ADR on demand"
phases:
  - name: capture
    description: "Record the architectural decision: context, decision, consequences."
    role: architect
    actions:
      - 'memory.add(type: adr)'
      - memory.submit
    produces:
      - "docs/memory/adr/{id}.md"
