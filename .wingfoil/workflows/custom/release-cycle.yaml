# One benchmark release, from scope to retrospective. Element: the `release` Memory element.
# No workflow engine exists: each phase is executed by hand against a `plan` element, and phase
# completion is read from element states and `produces:` artifacts.
# Version 2 (dl-006, task-020): calibration reads the release's spending ledger, and calibration and
# validation say how they differ from a delivery wave check. The unversioned original is version 1.
# Version 3 (dl-010 B, task-059): validation runs the real agent once per arm, on the scenario with
# the largest step, after each arm's environment is preflighted; the runs are consented (the phase's
# approval) and are lines of the ledger.
name: release-cycle
kind: sub
description: "Plan, deliver, calibrate, validate, measure, publish and review one benchmark release"
version: 3
element: release
phases:
  - name: release-planning
    description: >-
      Confirm scope from the sequencer; for v0.2+ run benchmark-specification for the new features;
      triage open bugs and decision-logs; create the release's first tasks. The release moves
      draft → planning (submit), then planning → in-development once the approver accepts the scope.
    role: product-owner
    actions:
      - memory.submit            # release: draft → planning
      - memory.approve           # release: planning → in-development (approver)
    approval: { by_role: approver }
  - name: delivery
    description: "Task after task through kanban-delivery, wave order, WIP limits."
    iterate_over: task
    include: kanban-delivery
  - name: calibration
    description: >-
      Dry-run every scenario of the release in every arm (real agent), record measured costs, and
      revise the budget (kickoff decision K4). The approver approves the revised budget. The
      release's spending ledger (docs/calibration/{release}-ledger.md) is an input: it says what
      delivery already spent, and none of its spikes or wave checks is a dry run. The dry runs are
      lines of the same ledger.
    role: scenario-author
    produces:
      - docs/calibration/{release}.md
    approval: { by_role: approver }
  - name: validation
    description: >-
      All acceptance tests green against the fake agent, coverage above 80%, lint clean, the Docker
      suite (npm run test:docker) green. Then, with the real agent, one run per arm of the release's
      campaign, each on the scenario with the largest step (the step with the largest output and
      cost in calibration's dry runs), so that every arm's setup and environment and the largest
      output are exercised once. Each arm's environment is preflighted (campaign validate) before
      any run. The approver consents to the runs before they start, with the model and a ceiling
      estimated from calibration's dry runs; each run is a line of the release's spending ledger.
      These runs validate the release as a whole; a delivery wave check (kanban-delivery
      real-agent-check) verified one wave's "Ends with".
    role: qa
    approval: { by_role: approver }
  - name: campaign
    description: >-
      The release's reference campaign (v0.1: the first preliminary result). Run through
      campaign-cycle, which is a startable main and is therefore launched on its own against the
      release's campaign element, not composed into this phase.
  - name: publishing
    description: >-
      Tag vX.Y, build and publish the site (v0.1: the repository becomes public first), release notes,
      transcripts as release assets. The release moves in-development → releasing (submit), then
      releasing → released with the approver. The link from WingFoil's README is done by the approver
      in the WingFoil repository.
    role: tech-lead
    actions:
      - memory.submit            # release: in-development → releasing
      - memory.approve           # release: releasing → released (approver)
    approval: { by_role: approver }
  - name: retrospective
    description: >-
      Mine the Execution Notes of the release's tasks and campaigns and the WingFoil usage notes for
      friction; record actions for the benchmark (decision-logs, bugs); hand the WingFoil usage notes
      to the approver for WingFoil's own retrospective.
    role: facilitator
    produces:
      - "release element: ## Retrospective section"
