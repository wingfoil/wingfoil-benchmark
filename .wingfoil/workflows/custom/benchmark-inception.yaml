# Benchmark inception (sub-workflow): a compact Lean Inception to frame the benchmark as a product
# (who it serves, what it is and is not, which features, in which order), followed by a
# Goal-Question-Metric experiment design, because the benchmark is first of all a measurement
# instrument and Lean Inception has no step for hypotheses, metrics and validity threats.
name: benchmark-inception
kind: sub
description: "Lean Inception + GQM experiment design for the benchmark"
phases:
  - name: brief
    description: "Product brief from the approver's answers: purpose, audiences, constraints, budget."
    role: facilitator
    produces:
      - docs/01_vision/01_product-brief.md
  - name: vision
    description: "Product vision + Is / Is not / Does / Does not."
    role: facilitator
    produces:
      - docs/01_vision/02_product-vision.md
      - docs/01_vision/03_is-isnot.md
  - name: personas
    description: "Personas of the benchmark's readers and contributors."
    role: facilitator
    produces:
      - docs/01_vision/04_personas.md
  - name: journeys
    description: "Journeys: publish a campaign, read a result, add a scenario, compare tools."
    role: facilitator
    produces:
      - docs/01_vision/05_journeys.md
  - name: features
    description: "Feature brainstorm + technical/business review."
    role: architect
    produces:
      - docs/01_vision/06_features.md
  - name: sequencer
    description: "Sequencer + MVP canvas (micro scenarios first, macro projects for majors)."
    role: product-owner
    produces:
      - docs/01_vision/07_sequencer.md
      - docs/01_vision/08_mvp-canvas.md
  - name: experiment-design
    description: "GQM: goals per category, questions, metrics, arms, validity threats, budget model."
    role: scenario-author
    produces:
      - docs/01_vision/09_experiment-design.md
