# Authoring one scenario version (journey J3). Used by the content tasks (F6.x) and by every future
# scenario. Public content goes to scenarios/<id>/<version>/; hold-out content only to the private
# hold-out repository.
name: scenario-authoring
kind: sub
description: "Design, write, validate and calibrate one scenario version"
phases:
  - name: goal
    description: "Name the GQM question(s) the scenario answers and its categories and profiles."
    role: scenario-author
  - name: seed
    description: "Write the seed repository (single initial commit, no hints, no rules — K3)."
    role: scenario-author
  - name: prompts
    description: "Write one prompt per step, harness-neutral, in a product owner's voice."
    role: scenario-author
  - name: oracle
    description: "Write the public oracle; write hold-out additions only in the hold-out repository."
    role: scenario-author
  - name: validate
    description: "Run the validator and leak scan (bench scenario validate, with the hold-out configured)."
    role: qa
  - name: calibrate
    description: "Dry-run in every arm with the real agent (approver's go required), record costs, adjust difficulty."
    role: scenario-author
    approval: { by_role: approver }
  - name: register
    description: "Freeze the scenario version (immutable from its first stored result — REQ-FMT-09)."
    role: scenario-author
