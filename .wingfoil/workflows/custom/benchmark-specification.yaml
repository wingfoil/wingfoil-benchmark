# Benchmark specification (sub-workflow): turns the approved inception (docs/01_vision/) into
# specifications precise enough to build release v0.1 from. Scope is the v0.1 release of the
# sequencer only; later releases are specified when they are planned.
name: benchmark-specification
kind: sub
description: "Scenario specs, acceptance criteria, requirements and traceability for v0.1"
phases:
  - name: scenario-specs
    description: "One spec per v0.1 scenario (S1, S2, S3, S8): GQM questions, seed, steps, oracle design, public/hold-out split, cost sizing."
    role: scenario-author
    produces:
      - docs/02_specification/scenarios/S1.md
      - docs/02_specification/scenarios/S2.md
      - docs/02_specification/scenarios/S3.md
      - docs/02_specification/scenarios/S8.md
  - name: acceptance
    description: "BDD acceptance criteria (Given/When/Then) for the v0.1 features of runner, scenarios, scoring and results."
    role: product-owner
    produces:
      - docs/02_specification/acceptance/
  - name: requirements
    description: "Technical requirements: data formats (campaign, scenario, results), architecture constraints, non-functional requirements."
    role: architect
    produces:
      - docs/02_specification/requirements.md
  - name: traceability
    description: "Matrix GQM question -> scenario -> metric, and feature -> acceptance -> requirement."
    role: reviewer
    produces:
      - docs/02_specification/traceability.md
