# retrospective, this repository's copy of base 2.0.1's (task-127, docs/pack-deviations.md D5): no `produces`, since
# WingFoil 0.3 reads a completed step's evidence from the whole repository (F-043, WingFoil bug-488) and
# docs/retrospective-inputs/ already exists; the approve step selects this repository's decision-log state
# (pending, D1) rather than base's in-discussion.
format: 1
name: retrospective
kind: sub
description: "Learn from the Execution Notes of a period and turn the learnings into decisions"
version: 1
phases:
  - name: explore
    description: >-
      Read the Execution Notes of every element closed in the period, the campaigns and the WingFoil feedback
      inbox (docs/wingfoil-feedback/); build a friction inventory grouped by theme, each point citing its source,
      in the release element's Retrospective section. Read-only.
    role: facilitator
    actions:
      - agent.execute
  - name: additional-points
    description: "The approver reviews the inventory and adds the points to analyse: a checkpoint."
    role: approver
    approval: { by_role: approver }
  - name: capture
    description: >-
      Record what to keep and what to change as a decision-log tagged retrospective (memory add --tags
      retrospective). A change of governance is a point, ruled by its own governance-evolution plan; a defect of
      WingFoil itself is a note in the feedback inbox, not a decision.
    role: facilitator
    actions:
      - 'memory.add(type: decision-log, tags: [retrospective])'
      - memory.submit
  - name: approve
    description: "The approver rules the retrospective's decision-log; a reject goes back to capture."
    role: approver
    where: { type: decision-log, status: [pending], tags: [retrospective] }
    actions:
      - memory.approve
    approval: { by_role: approver }
    fallback: { step: capture }
