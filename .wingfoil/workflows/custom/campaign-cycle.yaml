# One benchmark campaign execution (journey J2). Startable on its own: at every WingFoil release, and
# for a release's reference campaign (release-cycle › campaign), which launches it rather than
# including it — an include would require kind: sub, and that would cost the standalone start.
# Campaign machine (memory.yaml): draft → pending (gate: spend) → approved → running → scored
# (gate: results) → reviewed (gate: publish) → published.
name: campaign-cycle
kind: main
description: "Define, approve, run, score, review, publish one campaign"
element: campaign
phases:
  - name: define
    description: "Write the campaign file (every harness pinned, baseline arm included) and the campaign element."
    role: tech-lead
    actions:
      - memory.add
  - name: estimate
    description: "bench campaign estimate; record it in the element; submit (draft → pending)."
    role: tech-lead
    actions:
      - memory.submit            # draft → pending
  - name: approve-spend
    description: "The approver approves the spend (pending → approved) or rejects it (→ draft)."
    role: approver
    actions:
      - memory.approve
    approval: { by_role: approver }
  - name: run
    description: "bench campaign run (approved → running on start)."
    role: tech-lead
    actions:
      - memory.submit            # approved → running
  - name: score
    description: "bench score, with the hold-out configured (running → scored)."
    role: qa
    actions:
      - memory.submit            # running → scored
  - name: review-results
    description: "The approver reviews anomalies and reruns; accepts (scored → reviewed) or sends back (→ running)."
    role: approver
    actions:
      - memory.approve
    approval: { by_role: approver }
  - name: findings
    description: "Export finding notes (bench finding) for differences worth a WingFoil bug or decision-log."
    role: reviewer
  - name: publish
    description: "bench site build; the approver approves publishing (reviewed → published); bench site publish."
    role: approver
    actions:
      - memory.approve
    approval: { by_role: approver }
