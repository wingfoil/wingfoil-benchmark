# release, this repository's filling of software's release slot (task-127, docs/pack-deviations.md D4), from the
# retired release-cycle (version 7): calibration, validation and the campaign before the release's checks and its
# publication. The release keeps its two gates (memory.yaml: planning and releasing, the approver's; D2), so the
# moves are memory.submit and memory.approve rather than base's element.set_state.
format: 1
name: release
kind: sub
element: release
description: "Calibrate, validate, measure, check and publish one benchmark release"
version: 1
phases:
  - name: calibration
    description: >-
      Dry-run every scenario of the release in every arm (real agent), record measured costs and each dry-run
      step's transcript size in bytes, from which validation picks its scenario, and revise the budget (kickoff
      decision K4). The release's spending ledger (docs/calibration/<version>-ledger.md) is an input: it says what
      delivery already spent, and none of its spikes or wave checks is a dry run; the dry runs are lines of the
      same ledger. The approver approves the revised budget.
    role: scenario-author
    produces:
      - docs/calibration/{version}.md
    approval: { by_role: approver }
  - name: validation
    description: >-
      All acceptance tests green against the fake agent, coverage above 80%, lint clean, the Docker suite green.
      Then one real-agent run per arm, all on one scenario shared by every arm: the one with the largest step
      transcript (the step's transcript.jsonl, in bytes) in calibration's dry runs, across all arms (the larger
      cost breaks a tie), so that every arm's setup and environment and the largest output are exercised once.
      Before any run, every environment variable and path each arm needs is checked (campaign validate). The
      approver consents to the runs first, with the model and a ceiling estimated from calibration's dry runs: the
      step's approval is that consent. The runs are made from the main checkout, and each is a line of the ledger.
      They validate the release as a whole; a wave's real-agent check verified one wave's "Ends with".
    role: qa
    approval: { by_role: approver }
  - name: campaign
    description: >-
      The release requests its own campaigns (its reference campaign and its bridge). Each runs through
      campaign-cycle, a startable main launched on its own against its campaign element; its spending is the
      approver's consent at that element's gate. Never launched by a runner.
    role: scenario-author
  - name: pre-release-checks
    description: "The release's checks: the full suites green on main, the release notes, the site built."
    role: qa
    actions:
      - agent.execute
  - name: enter-releasing
    description: "The release enters releasing (in-development → releasing)."
    role: tech-lead
    actions:
      - memory.submit
  - name: publishing
    description: >-
      Tag vX.Y, publish the site, the release notes and the transcripts and harnesses as release assets; the
      approver approves the publication (releasing → released) and owns the push and the GitHub release; the link
      from WingFoil's README is done by the approver in the WingFoil repository. A reject goes back to the checks.
    role: tech-lead
    actions:
      - memory.approve
    approval: { by_role: approver }
    fallback: { step: pre-release-checks }
