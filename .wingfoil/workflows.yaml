# Workflow main configuration (task-127): methodology/kanban 1.0.0 composed with base 2.0.1 and software 1.0.0 by
# wingfoil-templates' reference composer, and this repository's own workflows. A custom file that fills a slot or
# copies a pack's workflow is included in place of the pack's (docs/pack-deviations.md); two files of one name fail
# every `workflow` command.
format: 1
version: 1
include:
  # base 2.0.1
  - workflows/built-in/decision-log-ingest.yaml
  - workflows/custom/governance-evolution.yaml
  - workflows/custom/retrospective.yaml
  - workflows/built-in/retrospective-periodic.yaml
  # software 1.0.0: the life cycle and its slots
  - workflows/built-in/sw-life-cycle.yaml
  - workflows/custom/inception.yaml
  - workflows/custom/specification.yaml
  - workflows/custom/end-of-life.yaml
  - workflows/custom/release.yaml
  - workflows/built-in/adr-ingest.yaml
  - workflows/built-in/bug-ingest.yaml
  # methodology/kanban 1.0.0: the delivery slot
  - workflows/custom/delivery.yaml
  - workflows/built-in/release-flow.yaml
  - workflows/custom/work-item.yaml
  # this repository's own mains
  - workflows/custom/scenario-authoring.yaml
  - workflows/custom/campaign-cycle.yaml
