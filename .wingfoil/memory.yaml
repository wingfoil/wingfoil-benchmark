# Memory element schema (P1.13) — scaffolded by `wingfoil init`.
# One entry per element type: its path pattern, its id pattern and its scaffold template. Every type
# below shares the `defaults` state machine; give a type its own `states:` block to override it for
# that type only (REQ-STATE-08).
version: 1

# Default state machine — applies to every type that declares no `states:` block of its own.
# `sequence` is the ordered forward chain (`submit` walks it); a `gates` state's forward edge needs
# `approve` instead, and its `reject` target is where a rejection lands. `deprecated` is implicit:
# `memory deprecate` reaches it from any state, so it is never listed here.
defaults:
  states:
    sequence: [ draft, pending, approved ]
    gates:
      pending: { reject: draft }

types:
  adr:
    amendable: true
    path: docs/memory/adr/{id}.md
    id_pattern: "adr-{n}-{slug}"
    template:
      file: memory/templates/adr.md
      frontmatter:
        required: [id, type, title, status]
  bug:
    # The default machine with `fixed` appended (bug-005, task-058). `approved` accepts the defect;
    # `approved → fixed` is a plain `submit` taken after the fixing task's work-item done step, once the fixing
    # task is done (the fix was gated at that task's in-review). The bug's optional `fixed_by` names
    # the task, whose `fixes` lists the bug; test/acceptance/traceability.test.ts holds the two together.
    # A bug closed without a fix (a duplicate, "works as designed") is `deprecated`.
    amendable: true
    path: docs/memory/bug/{id}.md
    id_pattern: "bug-{n}-{slug}"
    template:
      file: memory/templates/bug.md
      frontmatter:
        required: [id, type, title, status]
    states:
      sequence: [ draft, pending, approved, fixed ]
      gates:
        pending: { reject: draft }
  decision-log:
    amendable: true
    path: docs/memory/decision-log/{id}.md
    id_pattern: "dl-{n}-{slug}"
    template:
      file: memory/templates/decision-log.md
      frontmatter:
        required: [id, type, title, status]
  release:
    # One element per sequencer release (v0.1 … v1.0), driven by delivery and release-flow (task-127).
    # planning → in-development needs the approver (release scope approved); releasing → released
    # needs the approver (publication approved).
    amendable: true
    path: docs/memory/release/{id}.md
    id_pattern: "rel-{slug}"
    template:
      file: memory/templates/release.md
      frontmatter:
        # `release-line` (task-127): the composed release type requires it; rl-1 is the benchmark's release line.
        required: [id, type, title, status, version, waves, features, release-line]
        # WingFoil 0.3 (its bug-147): a required field holding a list is filled only if listed here, and
        # there `[]` counts as filled; test/unit/docs/required-lists.test.ts keeps both non-empty past draft (task-109).
        lists: [waves, features]
    states:
      sequence: [ draft, planning, in-development, releasing, released ]
      gates:
        planning: { reject: draft }
        releasing: { reject: in-development }
  release-line:
    amendable: false
    path: docs/memory/release-line/{id}.md
    id_pattern: "rl-{n}"
    template:
      file: memory/templates/release-line.md
      frontmatter:
        required: [id, type, title, status, version]
    # base 2.0.1's machine (task-127).
    states:
      sequence: [ draft, planning, active, done ]
      gates:
        planning: { reject: draft }
  task:
    # Delivery work item (work-item, task-127): methodology/kanban 1.0.0's type. backlog → in-progress and
    # approved → done are plain `submit`s; the two approver gates are pending (task accepted into backlog) and
    # in-review (work accepted). `amendable` and the states are the pack's (docs/pack-deviations.md D1).
    amendable: true
    path: docs/memory/task/{id}.md
    id_pattern: "task-{n}-{slug}"
    template:
      file: memory/templates/task.md
      frontmatter:
        # `features` and `acceptance` are NOT required: a knowledge task (a spike) delivers no
        # feature and implements no scenario, and `submit` on 0.2 read an empty list as a missing field.
        # A delivery task still declares both — test/acceptance/traceability.test.ts reads `features`
        # as "this task delivers these" and demands an acceptance test per scenario, and the review
        # phase checks traceability. Decided in W2 task-004 (approver, 2026-09-24).
        # `fixes` (optional) lists the bugs a task fixes, by full id (bug-005, task-058).
        required: [id, type, title, status, release, wave, requirements]
        # WingFoil 0.3 (its bug-147): a required field holding a list is filled only if listed here, and
        # there `[]` counts as filled; test/unit/docs/required-lists.test.ts keeps `requirements` non-empty (task-109).
        lists: [requirements]
        # The pack's: a task not yet planned carries `release: "n/a — <reason>"` (the kanban directive).
        not_applicable_allowed: [release]
    states:
      # methodology/kanban 1.0.0's machine (task-127): the same states, plus `returns` (an in-progress task can go
      # back to backlog) and the WIP limits, enforced by WingFoil over the whole repository.
      sequence: [ draft, pending, backlog, in-progress, in-review, approved, done ]
      gates:
        pending: { reject: draft }
        in-review: { reject: in-progress }
      returns:
        in-progress: backlog
      limits:
        in-progress: 1
        in-review: 1
  tech-spec:
    amendable: true
    path: docs/memory/tech-spec/{id}.md
    id_pattern: "spec-{n}-{slug}"
    template:
      file: memory/templates/tech-spec.md
      frontmatter:
        required: [id, type, title, status]
    # software 1.0.0's machine (task-127); this repository has written no tech-spec.
    states:
      sequence: [ draft, pending, approved, superseded ]
      gates:
        pending: { reject: draft }
      waiting: [ approved ]
  plan:
    # Phase plan — the executable plan for one workflow instance, authored when it starts and executed against.
    # `waiting: [active]` is the pack's: `workflow end` finalizes the plan active → done (task-127).
    amendable: true
    path: docs/plans/{id}.md
    id_pattern: "plan-{n}-{slug}"
    template:
      file: memory/templates/plan.md
      frontmatter:
        required: [id, type, title, status, workflow, phase]
    states:
      sequence: [ draft, active, done ]
      waiting: [ active ]
  campaign:
    # One element per benchmark campaign execution (campaign-cycle). Spending (pending), accepting the
    # scored results (scored) and publishing (reviewed) are approver decisions, so each is a gate and
    # lands in git with Approver/Reason.
    path: docs/memory/campaign/{id}.md
    id_pattern: "campaign-{n}-{slug}"
    template:
      file: memory/templates/campaign.md
      frontmatter:
        required: [id, type, title, status, release, campaign_file, wingfoil_commit]
    states:
      sequence: [ draft, pending, approved, running, scored, reviewed, published ]
      gates:
        pending: { reject: draft }
        scored: { reject: running }
        reviewed: { reject: scored }
