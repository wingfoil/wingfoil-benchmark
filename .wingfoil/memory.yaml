# Memory element schema (P1.13) — scaffolded by `wingfoil init`.
# One entry per element type: its path pattern, its id pattern and its scaffold template. Every type
# below shares the `defaults` state machine; give a type its own `states:` block to override it for
# that type only (REQ-STATE-08).
version: 1

# Default state machine — applies to every type that declares no `states:` block of its own.
# `sequence` is the ordered forward chain (`submit` walks it); a `gates` state's forward edge needs
# `approve` instead, and its `reject` target is where a rejection lands. `deprecated` is implicit:
# `memory deprecate` reaches it from any state, so it is never listed here.
defaults:
  states:
    sequence: [ draft, pending, approved ]
    gates:
      pending: { reject: draft }

types:
  adr:
    path: docs/memory/adr/{id}.md
    id_pattern: "adr-{n}-{slug}"
    template:
      file: memory/templates/adr.md
      frontmatter:
        required: [id, type, title, status]
  bug:
    path: docs/memory/bug/{id}.md
    id_pattern: "bug-{n}-{slug}"
    template:
      file: memory/templates/bug.md
      frontmatter:
        required: [id, type, title, status]
  decision-log:
    path: docs/memory/decision-log/{id}.md
    id_pattern: "dl-{n}-{slug}"
    template:
      file: memory/templates/decision-log.md
      frontmatter:
        required: [id, type, title, status]
  release:
    # One element per sequencer release (v0.1 … v1.0), driven by the release-cycle workflow.
    # planning → in-development needs the approver (release scope approved); releasing → released
    # needs the approver (publication approved).
    path: docs/memory/release/{id}.md
    id_pattern: "rel-{slug}"
    template:
      file: memory/templates/release.md
      frontmatter:
        required: [id, type, title, status, version, waves, features]
    states:
      sequence: [ draft, planning, in-development, releasing, released ]
      gates:
        planning: { reject: draft }
        releasing: { reject: in-development }
  release-line:
    path: docs/memory/release-line/{id}.md
    id_pattern: "rl-{n}"
    template:
      file: memory/templates/release-line.md
      frontmatter:
        required: [id, type, title, status]
  task:
    # Delivery work item (kanban-delivery). Adapted from WingFoil's own task machine, WITHOUT its
    # `waiting` states (backlog, approved): with no workflow engine those edges would have no verb.
    # backlog → in-progress and approved → done are therefore plain `submit`s by the agent; the two
    # approver gates are pending (task accepted into backlog) and in-review (work accepted).
    path: docs/memory/task/{id}.md
    id_pattern: "task-{n}-{slug}"
    template:
      file: memory/templates/task.md
      frontmatter:
        # `features` and `acceptance` are NOT required: a knowledge task (a spike) delivers no
        # feature and implements no scenario, and `submit` reads an empty list as a missing field.
        # A delivery task still declares both — test/acceptance/traceability.test.ts reads `features`
        # as "this task delivers these" and demands an acceptance test per scenario, and the review
        # phase checks traceability. Decided in W2 task-004 (approver, 2026-09-24).
        required: [id, type, title, status, release, wave, requirements]
    states:
      sequence: [ draft, pending, backlog, in-progress, in-review, approved, done ]
      gates:
        pending: { reject: draft }
        in-review: { reject: in-progress }
  tech-spec:
    path: docs/memory/tech-spec/{id}.md
    id_pattern: "spec-{n}-{slug}"
    template:
      file: memory/templates/tech-spec.md
      frontmatter:
        required: [id, type, title, status]
  plan:
    # Phase plan — the executable plan for one workflow phase, authored when the phase starts and
    # executed against, while WingFoil has no workflow engine yet.
    path: docs/plans/{id}.md
    id_pattern: "plan-{n}-{slug}"
    template:
      file: memory/templates/plan.md
      frontmatter:
        required: [id, type, title, status, workflow, phase]
    states:
      sequence: [ draft, active, done ]
  campaign:
    # One element per benchmark campaign execution (campaign-cycle). Spending (pending), accepting the
    # scored results (scored) and publishing (reviewed) are approver decisions, so each is a gate and
    # lands in git with Approver/Reason.
    path: docs/memory/campaign/{id}.md
    id_pattern: "campaign-{n}-{slug}"
    template:
      file: memory/templates/campaign.md
      frontmatter:
        required: [id, type, title, status, release, campaign_file, wingfoil_commit]
    states:
      sequence: [ draft, pending, approved, running, scored, reviewed, published ]
      gates:
        pending: { reject: draft }
        scored: { reject: running }
        reviewed: { reject: scored }
