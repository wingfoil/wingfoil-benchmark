# The site's catalogue (REQ-RES-11, task-104): what each published execution is, as the home presents it. Written by
# the maintainer; not part of any campaign file, so no campaign's identity changes. Kinds: reference (every harness
# against the baseline, on one agent), bridge (one change at a time between two reference campaigns), across-agents
# (headed "Other agents": any execution under another agent than Claude Code, its baseline compared across agents or
# its arms compared with each other, never mixed with the headlines, T14; task-108). `compared_with` names the
# executions this one's comparison pages are against (`bench campaign compare`); `notes` are shown on the execution's
# landing page and its across-agents page.
executions:
  81ebb2691f9c/1:
    title: v0.2 — Competitors
    kind: reference
    release: v0.2
    agent: Claude Code 2.1.300, Sonnet 5.5 (Opus 5.5 and Haiku 5.5 slices)
    arms: baseline, baseline-docs, WingFoil v0.3.0, Spec Kit v1.1.0, speckit-docs, OpenSpec 1.14.0, openspec-docs
    erratum: https://github.com/wingfoil/wingfoil-benchmark/blob/main/docs/releases/v0.2.md
    compared_with: [bf3a1ac7dff5/1]
  c82a5e74885b/2:
    title: v0.1 — First preliminary result
    kind: reference
    release: v0.1
    agent: Claude Code 2.1.280, Sonnet 5 (an Opus 5 slice)
    arms: baseline, baseline-docs, WingFoil v0.2.2
  bf3a1ac7dff5/1:
    title: v0.1 → v0.2 bridge
    kind: bridge
    release: v0.2
    agent: Claude Code 2.1.300, Sonnet 5.5
    arms: baseline, baseline-docs, WingFoil v0.2.2 (v0.1's arms on v0.2's model)
    compared_with: [c82a5e74885b/2]
  4682bcc65d6b/1:
    title: Codex baseline
    kind: across-agents
    release: v0.3
    agent: Codex CLI 0.162.1, gpt-6.1-sol (gpt-5.6-terra and gpt-6-luna slices)
    arms: baseline only
    compared_with: [81ebb2691f9c/1]
    notes:
      - Codex ran on a ChatGPT Plus subscription (dl-024); its cost is API-equivalent from a pinned OpenAI price table, not spent.
      - Codex 0.162.1 offers no generation-6 Terra, so the three Codex models mix generations (gpt-6.1, gpt-5.6, gpt-6).
      - The content checks are lexical (bug-026) and S1's step 5 is bimodal in every arm and agent (bug-025).
      - 'Preliminary: every group but S1 ran once; S1 ran three times per model.'
  13fda3099afa/1:
    title: Codex — WingFoil against its docs control, on Terra
    kind: across-agents
    release: v0.3
    agent: Codex CLI 0.162.1, gpt-5.6-terra
    arms: baseline, baseline-docs, WingFoil v0.3.0
    notes:
      - "Erratum (bug-036): in 12 of the wingfoil arm's 27 steps, the turn after the approver's reply ran on gpt-6.1-sol, Codex's default model, not on gpt-5.6-terra, and was priced as Terra. The baseline and baseline-docs arms are not affected. The wingfoil arm's comparison with its controls is therefore not clean and leans towards the arm. No rerun: the campaigns are preliminary, and this note stands."
      - Read arm against arm within Codex and one model; not compared across agents, since its approver policy (v2) differs from the Claude Code executions' (v1).
      - The wingfoil arm is v0.2's manual on WingFoil v0.3.0, a register of documents; WingFoil's workflow engine is not exercised.
      - Approver policy v2 answered the wingfoil arm's 13 approval requests. An earlier execution on v1 missed six of them and was not published (bug-035).
      - Codex ran on a ChatGPT Plus subscription; its cost is API-equivalent from a pinned OpenAI price table, not spent.
      - 'Preliminary: every group but S1 ran once; S1 ran three times. The content checks are lexical (bug-026).'
  697e79b75e41/1:
    title: Codex — WingFoil's workflow (step A) on Terra and Luna
    kind: across-agents
    release: v0.3
    agent: Codex CLI 0.162.1, gpt-5.6-terra (a gpt-6-luna slice)
    arms: baseline, baseline-docs (every role's directives), WingFoil v0.3.1 at step A
    compared_with: [13fda3099afa/1]
    notes:
      - "Step A: the session agent drives WingFoil 0.3.1's workflow, acting in each step's role and stopping at each review gate for the approver; its docs control carries every role's rules."
      - Read arm against arm within Codex and one model at a time; gpt-6-luna, the weak model, ran every scenario three times, gpt-5.6-terra S1 three times and the others once.
      - "The comparison with 13fda3099afa/1 (v0.2's manual on WingFoil v0.3.0) carries that execution's erratum (bug-036): its wingfoil arm's resumed turns ran on another model."
      - Approver policy v2 answered the wingfoil arm's 77 approval requests in 78 steps; in the other step the session asked nothing and the next one recovered.
      - Codex ran on a ChatGPT Plus subscription; its cost is API-equivalent from a pinned OpenAI price table, not spent.
      - 'Preliminary. The content checks are lexical (bug-026).'
