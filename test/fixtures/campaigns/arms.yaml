# The W3 campaign for the runner's own tests: the same scenario in the baseline, baseline-docs and
# wingfoil arms, with the WingFoil under test built from the clone in BENCH_WINGFOIL_REPO. Not
# benchmark content.
harnesses:
  wingfoil:
    tool: wingfoil
    version: v0.2.2
scenarios:
  - id: T2
    version: '1.0'
arms: [baseline, baseline-docs, wingfoil]
agent:
  name: fake
  version: 1.0.0
models:
  default: fake-model
repetitions:
  T2: 1
approver_policy: v1
caps:
  step_time_s: 60
  step_tokens: 1000
  run_cost_eur: 1
budget:
  warn_eur: 1
  ceiling_eur: 1
currency:
  usd_to_eur: 1
