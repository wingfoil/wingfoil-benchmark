# Multi-step campaign for the runner's own tests (W2 "Ends with"). Not benchmark content. The fake
# replays recordings of real sessions, whose costs count against the run cap although nothing is
# spent: the cap is sized for them.
harnesses: {}
scenarios:
  - id: T1
    version: '1.0'
arms: [baseline]
agent:
  name: fake
  version: 1.0.0
models:
  default: fake-model
repetitions:
  T1: 1
approver_policy: v1
caps:
  step_time_s: 60
  step_tokens: 1000
  run_cost_eur: 1
budget:
  warn_eur: 1
  ceiling_eur: 1
currency:
  usd_to_eur: 1
