# The eligibility register (REQ-FMT-11, F7.4): one entry per assessed tool and version, WingFoil included (T1). The
# verdict follows the five criteria, in their published order (site-content/eligibility.md). A campaign may give an arm
# only to a tool admitted here at the exact version it pins (REQ-FMT-01); a new version is assessed before it is pinned
# (T15). Evidence names its source; an assessment from documentation says so, and is re-assessed when a spike or the
# arm's own task finds otherwise (a new entry date).
criteria: [agent-and-model, pinnable, headless-container, workflow-harness, no-own-llm]
entries:
  - tool: wingfoil
    version: v0.2.2
    date: 2026-10-06
    criteria:
      agent-and-model:
        result: pass
        evidence: >-
          v0.1's reference campaign c82a5e74885b ran it with Claude Code 2.1.280 and the campaign's models (Sonnet 5,
          Opus 5): the agent works through WingFoil's CLI and MCP server, on the session's model.
      pinnable:
        result: pass
        evidence: >-
          The tag v0.2.2 resolves to commit 12537b62; the runner builds it from that commit into a cached tarball and
          installs the tarball in the run container (REQ-RUN-14, adr-003).
      headless-container:
        result: pass
        evidence: >-
          v0.1's campaign and calibration ran it in the run container without a terminal; its gates are answered by
          the neutral approver (REQ-RUN-17).
      workflow-harness:
        result: pass
        evidence: >-
          It drives a process — workflows with phases and approver gates, a Memory of elements with state machines,
          directives per role — not only a set of rules or prompts.
      no-own-llm:
        result: pass
        evidence: >-
          No model call of its own: its CLI and MCP server read and write the repository; every model call is the
          agent's, metered by the runner.
    verdict: admitted
    reason: Passes the five criteria; assessed by the same rule as every tool (T1).
  - tool: speckit
    version: v1.1.0
    date: 2026-10-06
    criteria:
      agent-and-model:
        result: pass
        evidence: >-
          From its documentation (the competitor re-verification of v0.2's planning): `specify init --integration claude` installs skills
          that Claude Code runs in its own session, on the session's model. Its workflow engine, which would start
          the agent itself, is not used (the approver's choice at rel-v0-2's triage).
      pinnable:
        result: pass
        evidence: >-
          Tag v1.1.0 of github/spec-kit, the latest release when assessed, installable as `uv tool install` of the tag and as an offline
          wheel bundle (docs/install/air-gapped.md); PyPI's specify-cli still lists 1.0.13, so the arm installs from
          the tag.
      headless-container:
        result: pass
        evidence: >-
          From its documentation: `init` runs without a terminal or network with the bundled assets, and the skills
          are followed by the agent in a headless session. Not yet run in the run container: task-065's spike
          re-assesses it there.
      workflow-harness:
        result: pass
        evidence: >-
          A spec-driven process — constitution, specify, plan, tasks, implement — with its templates, scripts and
          workflows under .specify/.
      no-own-llm:
        result: pass
        evidence: >-
          From its documentation: no model or key of its own; it shells out to the configured agent. No telemetry
          found.
    verdict: admitted
    reason: >-
      Passes the five criteria on its documentation; the arm's spike (task-065) checks the headless criterion in the
      run container.
  - tool: openspec
    version: 1.14.0
    date: 2026-10-06
    criteria:
      agent-and-model:
        result: pass
        evidence: >-
          From its documentation (the competitor re-verification of v0.2's planning): `openspec init --tools claude` writes Claude Code skills and commands
          (/opsx:*), run by the agent in its own session, on the session's model.
      pinnable:
        result: pass
        evidence: >-
          npm @fission-ai/openspec@1.14.0, an exact version, installable from an `npm pack` tarball. 1.14.1, published after
          that reading, is not assessed here.
      headless-container:
        result: pass
        evidence: >-
          From its documentation: `init` is non-interactive with --force; with stdin closed, `archive` needs --yes;
          its other questions are conversational, answered by the neutral approver. No TTY, browser or human-only
          step found.
      workflow-harness:
        result: pass
        evidence: >-
          A change-driven process — propose, apply, archive — whose state the CLI checks (`openspec status`,
          `openspec validate`).
      no-own-llm:
        result: pass
        evidence: >-
          From its documentation: no model or key of its own. Its telemetry, on by default, is not a model call; the
          arm turns it off (OPENSPEC_TELEMETRY=0), a parity rule published with its setup.
    verdict: admitted
    reason: Passes the five criteria on its documentation; the arm's own task checks them in the run container.
  - tool: bmad
    version: 6.12.1
    date: 2026-10-06
    criteria:
      agent-and-model:
        result: pass
        evidence: >-
          From its documentation (the competitor re-verification of v0.2's planning): `--tools claude-code` installs agents and workflows that Claude Code
          runs in its own session.
      pinnable:
        result: pass
        evidence: >-
          npm bmad-method@6.12.1, installed non-interactively (`npx bmad-method@6.12.1 install … --yes`). Its v7, on
          main and not released, changes the install.
      headless-container:
        result: fail
        evidence: >-
          From its documentation: its planning phases are persona-led facilitations whose questions ask for the
          project's content — its vision, users, requirements and choices — which only a person holds. The neutral
          approver answers approvals and clarifications with fixed replies, as for every arm (OpenSpec's questions are
          of that kind: which change, whether to sync); it cannot supply that content. Only `bmad-dev-auto` and the
          loop module are documented as unattended, not the process as a whole.
      workflow-harness:
        result: pass
        evidence: >-
          A multi-agent method with analysis, planning, solutioning and implementation phases, and their workflows.
      no-own-llm:
        result: pass
        evidence: >-
          From its documentation: no model or key of its own; its agents are prompts the configured agent runs.
    verdict: excluded
    reason: >-
      Fails headless-container: its process is not documented as runnable without a person supplying the project's
      content to its facilitations. A reading of its documentation, open to contest (F7.2); re-assessed when a release
      documents an unattended mode for the whole process, or a spike shows one.
